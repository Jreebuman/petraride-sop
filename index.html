>\n<\/blockquote>\n<p><strong>Part B: Inactivity Fees (Suspended Trips)<\/strong><\/p>\n<blockquote>\n<p>• Accident → Acceptable → Reverse<\/p>\n<p>• Customer far / traffic (verified on map) → Acceptable → Reverse<\/p>\n<p>• Technical issue → Acceptable → Reverse<\/p>\n<p>• Customer wanted to cancel (first time) → Acceptable → Reverse<\/p>\n<p>• Forgot trip / working on another app → Not acceptable → Keep fee<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>VIP trip cancellation by captain<\/td>\n<td>Fine + TL escalation + compensate VIP customer<\/td>\n<td>Fine + immediate TL flag<\/td>\n<td>Fine + note on captain<\/td>\n<td>Fine per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VIP customer compensated for wait<\/td>\n<td>Automatic compensation + personal apology<\/td>\n<td>Proactive wallet credit<\/td>\n<td>Courtesy gesture<\/td>\n<td>Not automatic<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "21", "title": "User Account Blocks", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle calls from customers whose accounts have been blocked, ensuring correct communication and solutions.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p>Confirm identity → Check system notes for block reason:<\/p>\n<blockquote>\n<p><strong>Scenario A – Fraud:<\/strong> Inform customer of reason. Check device level if account appears active but inaccessible.<\/p>\n<p><strong>Scenario B – Unpaid amount:<\/strong> Inform customer. Account reactivation requires settling the outstanding balance.<\/p>\n<p><strong>Scenario C – High cancellation rate:<\/strong> Check records. If customer requests reactivation: escalate ticket to relevant team.<\/p>\n<p><strong>Scenario D – Inappropriate conduct:<\/strong> Do NOT inform customer of specific reason. Handle professionally to de-escalate and escalate ticket to specialized processing team.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Account block notification<\/td>\n<td>TL handles notification directly<\/td>\n<td>Apologize + explain options clearly<\/td>\n<td>Standard + empathetic tone<\/td>\n<td>Standard communication<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Reinstatement process<\/td>\n<td>TL personally reviews — immediate reinstatement if no fraud<\/td>\n<td>Fast-track review<\/td>\n<td>Priority review<\/td>\n<td>Per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Compensation after block resolved<\/td>\n<td>Wallet credit + personal apology from TL<\/td>\n<td>Wallet credit<\/td>\n<td>Small gesture<\/td>\n<td>Not standard<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "22", "title": "Safety, Violations, and General Complaints", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle critical safety concerns, identity/vehicle mismatches, unauthorized communication, and behavioral complaints with strict escalation protocols.<\/p>\n<p><strong>Part A: Front Seat Violations<\/strong><\/p>\n<p>Captain calling: Confirm name → Strict warning → OB customer to apologize → Escalate ticket.<\/p>\n<p>Customer calling: Confirm name → Apologize → Escalate for disciplinary action.<\/p>\n<p><strong>Part B: Different Captain or Vehicle<\/strong><\/p>\n<p>Captain calling: Confirm name. If mismatch: escalate immediately.<\/p>\n<p>Customer calling: Confirm name + apologize → Gather vehicle details → OB captain → If denies: contact last 3 customers → Escalate with findings.<\/p>\n<p><strong>Part C: Sensitive Cases (Customer Calls)<\/strong><\/p>\n<p>Confirm name + apologize → Courtesy compensation if needed → Contact captain's last 3 customers → Escalate immediately to safety team.<\/p>\n<p>Sensitive categories (all require escalation): Harassment, Drunk driver, Inappropriate staring, Unethical behavior, Political discussion, Inappropriate clothing.<\/p>\n<p><strong>Part D: Unauthorized Contact by Captain<\/strong><\/p>\n<p>Confirm name + apologize → Identify contact method → Request screenshot. If screenshot provided: escalate immediately. If not: OB captain then escalate.<\/p>\n<p><strong>Part E: General Complaints<\/strong><\/p>\n<p>Confirm name + apologize → Identify problem → OB captain → Check PSMA license. If licensed: escalate immediately. If not licensed: apply matrix.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Safety/behavior complaint<\/td>\n<td>TL handles directly + full compensation + 24hr follow-up<\/td>\n<td>Escalate + compensation + same-shift QA review<\/td>\n<td>Escalate + courtesy compensation<\/td>\n<td>Standard escalation<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Front seat violation<\/td>\n<td>TL handles + compensate VIP + captain suspension review<\/td>\n<td>Warn captain + compensate + TL flag<\/td>\n<td>Warn captain + compensate customer<\/td>\n<td>Warn captain + escalate<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Unauthorized contact<\/td>\n<td>Immediate TL + full compensation + security review<\/td>\n<td>Escalate + apology + wallet credit<\/td>\n<td>Escalate + apology<\/td>\n<td>Escalate per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "23", "title": "Handling Bad Behavior (Calls &amp; Chats)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish strict guidelines for handling verbal abuse and inappropriate behavior from captains or customers during support interactions.<\/p>\n<p><strong>Part A: Bad Behavior During Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – General insults / profanity:<\/strong> Issue one warning. If repeated: end call professionally.<\/p>\n<p><strong>Scenario 2 – Direct personal insults:<\/strong> No warning needed. End call immediately with a professional closing statement.<\/p>\n<p><strong>Scenario 3 – Company criticism:<\/strong> Do not end the call. Allow the caller to speak and handle their complaint professionally.<\/p>\n<\/blockquote>\n<p><strong>Part B: Bad Behavior During Chats<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Text insults:<\/strong> Same warning system as calls.<\/p>\n<p><strong>Scenario 2 – Sharing inappropriate media:<\/strong> Zero tolerance. Send professional closing message → Close conversation immediately → Escalate ticket.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Handling VIP frustration<\/td>\n<td>TL joins call if customer remains upset<\/td>\n<td>High empathy + immediate offer to resolve<\/td>\n<td>Warm empathetic tone + extra patience<\/td>\n<td>Standard de-escalation<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ending call on VIP<\/td>\n<td>Never end call — TL must take over<\/td>\n<td>Avoid ending — escalate to TL if needed<\/td>\n<td>Avoid ending — de-escalate<\/td>\n<td>Per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "24", "title": "General User Account &amp; Promo Code Inquiries", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle phone-based profile update requests and promo code inquiries via messaging channels.<\/p>\n<p><strong>Part A: Profile Update Requests (Inbound Call)<\/strong><\/p>\n<blockquote>\n<p><strong>General edits (name, email):<\/strong> Guide customer step-by-step to Profile Settings in the app.<\/p>\n<p><strong>Phone number change:<\/strong> Inform customer this feature is currently unavailable. They must sign out and re-register with the new number.<\/p>\n<\/blockquote>\n<p><strong>Part B: Promo Code Inquiries (Messages / Chat)<\/strong><\/p>\n<p>Confirm identity → Check for active promo codes. If available: provide immediately. Always direct customer to official social media regardless of outcome.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Profile update support<\/td>\n<td>Full guided assistance + confirm update completed<\/td>\n<td>Guide + offer to stay on line during update<\/td>\n<td>Guide + patience<\/td>\n<td>Guide to app settings<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Promo code for VIP<\/td>\n<td>Always check for any exclusive VIP promo opportunities<\/td>\n<td>Check all active promos + offer relevant ones<\/td>\n<td>Provide if available + check extras<\/td>\n<td>Provide if available<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "25", "title": "Inquiries About Old Trips", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle customer calls regarding previous trips with correct identity verification and privacy protection.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario A – Calling from registered number:<\/strong> Identity matches → Assist immediately with requested information.<\/p>\n<p><strong>Scenario B – Calling from different number:<\/strong> Identity mismatch → Ask security questions (pickup/drop-off location, date, captain name). If answered correctly: assist. If unable to verify: refuse for privacy protection.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Old trip dispute<\/td>\n<td>Resolve immediately in customer's favor + compensate if needed<\/td>\n<td>Investigate + resolve in customer's favor<\/td>\n<td>Investigate + lean toward customer<\/td>\n<td>Investigate + standard resolution<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Security verification flexibility<\/td>\n<td>Light verification — trust VIP + proceed<\/td>\n<td>One question correct = assist<\/td>\n<td>Standard verification<\/td>\n<td>Strict verification required<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "26", "title": "Captain Registration &amp; Representative Directory", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle calls from captains wishing to register, ensuring correct routing to the office or representative.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p>Confirm identity → Determine operating city → Route to correct registration path:<\/p>\n<blockquote>\n<p><strong>Scenario A – Office registration:<\/strong> Provide office address. Open Sunday–Thursday. Document requirements provided upon arrival.<\/p>\n<p><strong>Scenario B – Registration via representative:<\/strong> Identify representative from directory by city. Provide name and WhatsApp number. WhatsApp only during official working hours.<\/p>\n<\/blockquote>\n<p><strong>4. Representative Directory<\/strong><\/p>\n<blockquote>\n<p>• Karak, Madaba → Mohannad → 0790136017<\/p>\n<p>• Jerash, Mafraq, Ramtha, Ajloun → Ahmad Al-Qreishi → 0799333413<\/p>\n<\/blockquote>"}, {"num": "27", "title": "Visa Inquiries and Trip Issues (User)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle customer calls regarding Visa card management, frequently asked questions, and billing adjustments.<\/p>\n<p><strong>Part A: General Visa FAQ<\/strong><\/p>\n<blockquote>\n<p><strong>How do I add a Visa card?:<\/strong> App menu → Wallet &amp; Card → Add New Card.<\/p>\n<p><strong>Why was 5 JD deducted?:<\/strong> Temporary hold from Google Play — refundable.<\/p>\n<p><strong>Why was 0.1 JD deducted?:<\/strong> Small verification transaction from Visa to confirm card validity.<\/p>\n<p><strong>How do I change payment method?:<\/strong> From the booking screen before confirming the trip request.<\/p>\n<p><strong>Can I change payment method after booking?:<\/strong> Yes, still possible after submitting the trip request.<\/p>\n<p><strong>Can I mix payment methods?:<\/strong> Cannot mix cash and Visa directly. Either can be combined with a promo code or wallet balance.<\/p>\n<\/blockquote>\n<p><strong>Part B: Visa Trip Issues (Distance Adjustments)<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Distance Plus (Visa):<\/strong> Determine compensation preference: app wallet or bank account. If bank account: escalate to Finance team.<\/p>\n<p><strong>Scenario 2 – Distance Minus (Visa):<\/strong> If no cash: compensate captain from system → Advise customer to top up wallet for owed amount → Escalate to Finance for deduction.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Visa dispute resolution<\/td>\n<td>Immediate resolution + full compensation if any overcharge<\/td>\n<td>Resolve in same call<\/td>\n<td>Priority handling<\/td>\n<td>Standard process<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Finance team escalation<\/td>\n<td>Same-day resolution with TL involvement<\/td>\n<td>Urgent flag<\/td>\n<td>Priority flag<\/td>\n<td>Standard timeline<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "28", "title": "Ticketing System — Trip Receiving – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - trip receiving - cancel<\/strong><\/td>\n<td>General trip receiving<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Receiving Trips Amman<\/strong><\/td>\n<td>Receiving trips in Amman<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Receiving Trips Irbid<\/strong><\/td>\n<td>Receiving trips in Irbid<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Receiving Trips Zarqa'<\/strong><\/td>\n<td>Receiving trips in Zarqa<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Test Dispatch<\/strong><\/td>\n<td>Send a test dispatch to captain<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "29", "title": "Ticketing System — Blocked Account – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Block complaint - office<\/strong><\/td>\n<td>Office visit required<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Block complaint - check notify<\/strong><\/td>\n<td>Block with specific fine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - block call registered number<\/strong><\/td>\n<td>Contact via registered number (available)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - call registered<\/strong><\/td>\n<td>Contact via registered number (disconnected)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Alert<\/strong><\/td>\n<td>Alert / warning only<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - cash block new<\/strong><\/td>\n<td>Block cash trips<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Already Unblocked<\/strong><\/td>\n<td>Previously resolved<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "30", "title": "Ticketing System — Contests – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Contest - wallet<\/strong><\/td>\n<td>Prize added to wallet<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Contest in prog<\/strong><\/td>\n<td>Under analysis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Contest failed<\/strong><\/td>\n<td>Failed the contest<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Contest new<\/strong><\/td>\n<td>Contest paused<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "31", "title": "Ticketing System — Wallet Related Issues – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Bill - cancellation fee<\/strong><\/td>\n<td>Cancellation fee in bill<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Bill - Promo code<\/strong><\/td>\n<td>Promo code in bill<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Driver fine<\/strong><\/td>\n<td>1 JD driver fine<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Inactivity Fee<\/strong><\/td>\n<td>5 JD inactivity fee<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - bonus away far<\/strong><\/td>\n<td>Far pickup point complaint<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "32", "title": "Ticketing System — Follow-up for Previous Complaints – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Already Solve<\/strong><\/td>\n<td>Previously resolved<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - note in prog<\/strong><\/td>\n<td>In progress<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Follow<\/strong><\/td>\n<td>Resolved — provide outcome<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "33", "title": "Ticketing System — Acceptance Ratio &amp; Rating – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Acceptance Ratio<\/strong><\/td>\n<td>Acceptance ratio inquiry<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Adjust Acceptance Ratio<\/strong><\/td>\n<td>Adjust acceptance ratio<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Rating<\/strong><\/td>\n<td>Rating inquiry or complaint<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Rating adjusted - Irbid<\/strong><\/td>\n<td>Rating investigation in Irbid<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Rating Irbid<\/strong><\/td>\n<td>Irbid captain complaint details<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "34", "title": "Ticketing System — Update Information – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Update information<\/strong><\/td>\n<td>Profile information update<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Update car Information<\/strong><\/td>\n<td>Vehicle information update<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - change password<\/strong><\/td>\n<td>Password / security code change<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "35", "title": "Ticketing System — Registration – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Registration - Licensed<\/strong><\/td>\n<td>Standard / regular registration<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Registration - Taxi<\/strong><\/td>\n<td>Taxi registration<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "36", "title": "Ticketing System — Payout – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Payout request<\/strong><\/td>\n<td>Payout pending<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - payout - Paid<\/strong><\/td>\n<td>Payout completed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - payout - cancel<\/strong><\/td>\n<td>Cancel withdrawal request<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "37", "title": "Ticketing System — General Inquiries – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Cancellation fee inquire<\/strong><\/td>\n<td>Cancellation fee policy<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Destination inq<\/strong><\/td>\n<td>Destination assignment inquiry<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Payout request<\/strong><\/td>\n<td>Payout request<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Saving Inquires<\/strong><\/td>\n<td>Savings account inquiry<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Voucher Card inquire<\/strong><\/td>\n<td>Regular voucher card inquiry<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - E-Voucher inquire<\/strong><\/td>\n<td>Electronic voucher inquiry<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Voucher Card<\/strong><\/td>\n<td>Unspecified voucher<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Wallet Delay<\/strong><\/td>\n<td>Visa / wallet delay<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "38", "title": "Ticketing System — Other / Miscellaneous – Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Review the ticket → Identify the scenario → Select the correct macro:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Macro Name<\/strong><\/td>\n<td><strong>Use When<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Suggestion<\/strong><\/td>\n<td>Suggestion from captain<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ticketing System - Missing info<\/strong><\/td>\n<td>Missing / unclear information<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Price complaint<\/strong><\/td>\n<td>Price complaint<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "39", "title": "Outbound Call — Luxury Ride (Customer)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle outbound calls for customers requesting a luxury ride, confirming trip details and capacity limits.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p>Step 1: Make OB call. Confirm pickup/drop-off locations, number of passengers, and luggage.<\/p>\n<p>Step 2: Inform customer of Luxury vehicle capacity: Maximum 6 persons and 2 bags. Each extra bag reduces the person count by one.<\/p>\n<p>Step 3: Calculate and inform customer of total trip cost.<\/p>\n<p>Step 4: If customer agrees: send Cliq payment details. If declines: end call politely and close ticket.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Luxury ride booking<\/td>\n<td>Complimentary upgrade consideration + personal booking assistance<\/td>\n<td>Priority booking + courtesy upgrade if available<\/td>\n<td>Priority booking<\/td>\n<td>Standard process<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pricing flexibility<\/td>\n<td>TL can approve promotional pricing for Elite retention<\/td>\n<td>Discuss with TL for any adjustments<\/td>\n<td>Fixed pricing<\/td>\n<td>Fixed pricing<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "40", "title": "Outbound Call — Booking Trip (Scheduled Rides)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle outbound calls for pre-booked scheduled trips, confirming both customer and captain commitment.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p>Contact customer first, then captain:<\/p>\n<blockquote>\n<p><strong>Scenario A – Customer answers:<\/strong> Confirm trip intent → Contact captain. If captain accepts: direct to location. If captain refuses: reassign new captain + OB new captain.<\/p>\n<p><strong>Scenario B – Customer doesn't answer:<\/strong> OB captain directly. If captain accepts: direct to location. If captain refuses: reassign. If captain also doesn't answer: cancel the trip.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Pre-trip confirmation call<\/td>\n<td>Make OB call 1 hr before + confirm all details + TL monitors<\/td>\n<td>Make OB call 45 min before + confirm captain details<\/td>\n<td>Make OB call 30 min before trip<\/td>\n<td>Standard<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Captain no-show / cancellation<\/td>\n<td>Reassign in &lt; 5 min + wallet credit + personal apology from TL<\/td>\n<td>Reassign immediately + apologize + wallet credit<\/td>\n<td>Reassign + inform customer + apologize<\/td>\n<td>Reassign per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "41", "title": "Rating Task — Different Vehicle", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>OB customer. If answers: apologize + collect vehicle details (color, model, plate). If no answer: send Notify - Rating (need customer call).<\/p>\n<p>OB captain regardless of customer response. If captain admits: escalate immediately. If captain denies: contact last 3 customers to check for pattern → escalate with findings.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>OB priority<\/td>\n<td>Standard OB<\/td>\n<td>Priority OB within 1 hr<\/td>\n<td>Priority OB within 30 min<\/td>\n<td>Immediate OB + TL notified<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Compensation<\/td>\n<td>Not standard<\/td>\n<td>Courtesy gesture<\/td>\n<td>Wallet credit<\/td>\n<td>Full compensation + formal apology<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "42", "title": "Rating Task — Extra Amount Charged", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Check 'financial suspicion' flag on customer's profile.<\/p>\n<p>If customer answers OB: No flag + captain admits → Use Add/Deduct button + inform 48hr resolution. No flag + captain denies → Compensate max 2 JD. Flag present + captain admits → Add/Deduct + escalate. Flag + captain denies → No compensation + note on both profiles.<\/p>\n<p>If customer does not answer OB: No flag + captain admits → Add/Deduct + Notify. No flag + captain denies → Compensate from tracking (2 JD). Has flag + captain denies → Notify + call again. Still no answer: no comp + note + system adjustment.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Compensation (customer answers)<\/td>\n<td>Max 2 JD<\/td>\n<td>Up to 4 JD<\/td>\n<td>Up to 6 JD<\/td>\n<td>Full amount — no cap<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Compensation (customer no answer)<\/td>\n<td>From tracking (2 JD)<\/td>\n<td>From tracking (3 JD)<\/td>\n<td>From tracking (5 JD)<\/td>\n<td>Full refund + OB attempt x4<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "43", "title": "Rating Task — Behavioral &amp; General Complaints", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>OB customer. If answers: apologize. If no answer: send Notify - N-A (CSAT).<\/p>\n<p>Check captain's profile:<\/p>\n<p>No prior note → OB captain. If answers (attempt 1 or 2): issue warning + add note. If no answer x2: escalate for account block.<\/p>\n<p>Prior note exists → OB captain with strict warning. Escalate for disciplinary action.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Complaint handling priority<\/td>\n<td>Standard<\/td>\n<td>Priority same shift<\/td>\n<td>Priority within 2 hrs<\/td>\n<td>Immediate TL + dedicated resolution<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Courtesy compensation<\/td>\n<td>Not automatic<\/td>\n<td>If requested<\/td>\n<td>Proactive offer<\/td>\n<td>Always offer — wallet credit minimum<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "44", "title": "Rating Task — Different Route (Long Path)", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Resolution Matrix — Captain response:<\/p>\n<p>Captain admits (no notes): Apply Add/Deduct button + adjust admin commission + add note on captain.<\/p>\n<p>Captain admits (has notes): Apply Add/Deduct + adjust commission + escalate.<\/p>\n<p>Captain denies (no notes): Compensate customer max 1 JD + note on captain.<\/p>\n<p>Captain denies (has notes): Compensate max 1 JD + escalate ticket.<\/p>\n<p>Standard treatment<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Compensation (captain admits)<\/td>\n<td>Fare difference refunded<\/td>\n<td>Fare difference + 1 JD<\/td>\n<td>Fare difference + 2 JD<\/td>\n<td>Full fare difference + courtesy credit<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Compensation (captain denies)<\/td>\n<td>Max 1 JD<\/td>\n<td>Up to 3 JD<\/td>\n<td>Up to 5 JD<\/td>\n<td>Full difference — believe customer<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "45", "title": "Rating Task — Other", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Scenario A – Unclear review: If customer answers: ask for clarification → redirect to relevant SOP. If no answer: adjust rating + add note: 'Invalid low rating'.<\/p>\n<p>Scenario B – Clear review in 'Other' category: If customer answers: gather details → redirect to relevant SOP. If no answer: send Notify - Rating (need customer call). Check captain: no note → adjust rating + note + alert. Has note → escalate.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Review handling<\/td>\n<td>Standard<\/td>\n<td>Standard<\/td>\n<td>Lean toward customer's version<\/td>\n<td>Accept customer's version — adjust in their favor<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "46", "title": "Rating Task — Higher Price Than Estimated", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Step 1: Recalculate the trip in the system (mandatory before any action).<\/p>\n<p>Step 2: Based on recalculation: Scenario A – Complaint is price only → Send notification: Notify - Fair trip (user). Scenario B – Complaint includes price AND other issues → Stop this SOP, redirect to the relevant SOP for the other issue.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Price dispute resolution<\/td>\n<td>Recalculate + notify<\/td>\n<td>Recalculate + explain clearly<\/td>\n<td>Recalculate + if any overcharge: refund<\/td>\n<td>Refund any overcharge immediately — no recalculation delay<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "47", "title": "Rating Task — Payment Method Disputes", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Part A – Customer wrote a review: If customer answers: apologize + investigate payment dispute + escalate immediately. If no answer: send Notify - Rating (need customer call) + escalate based on review.<\/p>\n<p>Part B – No review: Scenario 1 – customer answers: apologize + investigate + escalate. Scenario 2 – no answer: send notification + call again later. Based on 2nd call outcome: if answers: apologize + investigate + escalate. If still no answer: check dashboard. If payment method changed: escalate. If no change: treat as unverified low rating.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Payment dispute priority<\/td>\n<td>Standard<\/td>\n<td>Priority escalation<\/td>\n<td>Same-call resolution<\/td>\n<td>Immediate resolution + refund any discrepancy<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "48", "title": "Rating Task — AC and Vehicle Hygiene", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>OB customer. If answers: apologize. If no answer: send Notify - N-A (CSAT).<\/p>\n<p>Check captain's profile for prior AC/hygiene notes.<\/p>\n<p>Scenario A – No prior notes: Send formal alert to captain + record complaint as note on file.<\/p>\n<p>Scenario B – Repeat offender (has notes): Escalate ticket immediately to QA team — no standard warning.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hygiene/AC complaint<\/td>\n<td>Standard + note on captain<\/td>\n<td>Formal warning + note<\/td>\n<td>QA flag + compensation<\/td>\n<td>QA escalation + immediate compensation + TL follow-up with customer<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "49", "title": "Rating Task — Rating Submitted by a Child (Kid)", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>After confirming the rating was submitted by a child (via OB call, review, or account holder confirmation):<\/p>\n<p>Step 1: Adjust (delete) the unfair low rating in the system so it does not affect the captain's overall performance metrics.<\/p>\n<p>Step 2: Document on the customer's profile with a clear note such as: 'Invalid low rating — submitted by a child, adjusted.'<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Child rating from VIP account<\/td>\n<td>Adjust per policy<\/td>\n<td>Adjust + courtesy note to account<\/td>\n<td>Adjust + apology to parent if they call<\/td>\n<td>Adjust + proactive OB to VIP to confirm satisfaction<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "50", "title": "Safety Violation — Someone Else with the Captain", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Captain calling: Confirm name → Issue strict warning about policy → OB customer to apologize → Escalate ticket.<\/p>\n<p>Customer calling: Confirm name → Apologize → Escalate for disciplinary action against captain.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Complaint response<\/td>\n<td>Standard escalation<\/td>\n<td>Standard + compensation<\/td>\n<td>Escalate + wallet credit<\/td>\n<td>Immediate TL + full compensation + captain review<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "51", "title": "Captain Refused Multiple Destination Changes", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>Confirm customer name → Investigate refusal reason → OB captain. If captain admits unreasonable refusal: note + warning. If captain has prior notes: escalate for disciplinary action. Compensate customer if inconvenienced.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Destination dispute<\/td>\n<td>Investigate + standard<\/td>\n<td>Lean toward customer<\/td>\n<td>Resolve in customer's favor<\/td>\n<td>Full customer satisfaction — compensate immediately<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "52", "title": "Live Trip Issue — Captain Taking a Different Route", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>OB customer: confirm they are safe and get their location. OB captain: ask about the route deviation. If innocent (map error / road closure): advise and monitor. If deliberate: warn captain strictly, compensate customer, escalate.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Live route deviation<\/td>\n<td>Investigate + note<\/td>\n<td>Compensate if any overcharge<\/td>\n<td>Compensate + QA flag on captain<\/td>\n<td>Full refund + immediate TL escalation<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "53", "title": "Live Trip Issue — Captain Picked Up the Wrong Customer", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>OB captain: confirm what happened. OB correct customer: apologize, confirm they are safe, arrange new captain if needed. Compensate correct customer for inconvenience. Investigate captain's account for prior incidents. Escalate ticket.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Wrong pickup affecting VIP<\/td>\n<td>Standard resolution<\/td>\n<td>Apology + compensation<\/td>\n<td>Priority resolution + wallet credit<\/td>\n<td>Immediate TL + full compensation + personal apology<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "54", "title": "Critical Safety Violation — Unethical Behavior", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ This is a Level 1 safety incident. The Team Leader MUST be looped in immediately.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Intake: Confirm customer name. Allow them to speak without interruption. Do not minimize the complaint.<\/p>\n<p>Immediate steps: Apologize sincerely. Do not contact captain until TL is aware. Escalate to Safety &amp; QA team within the same shift.<\/p>\n<p>Follow-up: TL conducts OB call to customer within same day. Full written incident report required. Captain's account suspended pending investigation.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Unethical behavior complaint<\/td>\n<td>TL escalation + full compensation<\/td>\n<td>TL escalation + full compensation<\/td>\n<td>TL escalation + compensation + priority follow-up<\/td>\n<td>TL personal handling + full compensation + same-day follow-up call<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "55", "title": "Safety Violation — Captain Sleeping on the Job", "body": "<p><strong>3. Procedure<\/strong><\/p>\n<p>OB captain: confirm the incident. If captain admits: issue strict formal warning + note on profile. If captain denies: gather evidence (QA review, customer rating, timestamps). Escalate to QA team regardless.<\/p>\n<p>OB customer to apologize + offer compensation for the safety concern.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Captain sleeping complaint<\/td>\n<td>Escalate + compensate<\/td>\n<td>Escalate + compensate up to 5 JD<\/td>\n<td>Escalate + 8 JD compensation<\/td>\n<td>Full compensation + personal TL apology + captain suspension review<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "56", "title": "Currency Issues — Counterfeit or Damaged Money", "body": "<p><strong>Part A: Captain Received Counterfeit/Damaged Money from Customer<\/strong><\/p>\n<blockquote>\n<p><strong>Counterfeit (customer denies, clean record):<\/strong> Compensate captain manually + note on customer profile + escalate to risk team.<\/p>\n<p><strong>Counterfeit (customer no answer x2):<\/strong> Advise captain to file police complaint + escalate immediately.<\/p>\n<p><strong>Damaged currency:<\/strong> Advise captain to inspect banknotes before allowing passenger to leave in future. No compensation.<\/p>\n<\/blockquote>\n<p><strong>Part B: Customer Received Counterfeit/Damaged Money from Captain<\/strong><\/p>\n<blockquote>\n<p><strong>Counterfeit (captain admits):<\/strong> Deduct from captain's wallet + compensate customer + escalate to Fraud team.<\/p>\n<p><strong>Counterfeit (captain denies):<\/strong> Advise customer to file police complaint.<\/p>\n<p><strong>Damaged currency:<\/strong> Advise customer to inspect cash inside the vehicle before exiting in future.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Currency fraud compensation<\/td>\n<td>Investigate + compensate if proven<\/td>\n<td>Compensate + note<\/td>\n<td>Compensate immediately + escalate<\/td>\n<td>Full compensation immediately + TL escalation + priority fraud review<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "57", "title": "Safety Incident — Customer Fled in Distress", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>A high-priority, sensitive protocol for extreme safety incidents where a passenger exits the vehicle in severe distress. Child safety and passenger wellbeing are the only priority.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p>Intake: Listen to captain's account. Assess captain's tone carefully.<\/p>\n<p>OB customer immediately to verify safety and determine root cause.<\/p>\n<blockquote>\n<p><strong>Workflow A — Captain's Bad Behavior:<\/strong> Apologize sincerely + prioritize customer safety + instruct customer NOT to pay. Check captain profile: no prior note → write note + compensate captain from company side. Prior note → do NOT compensate captain + escalate immediately.<\/p>\n<p><strong>Workflow B — Route Deviation Causing Panic:<\/strong> Apologize + instruct customer NOT to pay + do NOT compensate captain (responsible for poor communication) + write note on captain's profile + escalate if captain has prior notes.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Fled in distress — VIP customer<\/td>\n<td>Full protocol + compensate<\/td>\n<td>Full protocol + wallet credit + apology<\/td>\n<td>Full protocol + priority follow-up + TL notification<\/td>\n<td>TL handles personally + full compensation + 24hr follow-up call<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}</script>
<script type="application/json" id="data-ar">{"intro": "<p><strong>بيترا رايد<\/strong><\/p>\n<p><strong>إجراءات التشغيل القياسية<\/strong><\/p>\n<p>دليل عمليات دعم العملاء<\/p>\n<p>الإصدار 2.0 | 57 إجراء | يشمل بروتوكولات فئات الربح وKids Ride<\/p>\n<p><strong>تصنيف أولوية العميل: فئة الربح + عدد الرحلات<\/strong><\/p>\n<p>يجب على جميع الوكلاء التحقق من فئة الربح الخاصة بالعميل في النظام قبل معالجة أي شكوى. النظام يحدد الفئة تلقائياً — لا حساب يدوي مطلوب. تحدد الفئة أسلوب التعامل مع العميل.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>عدد الرحلات<\/td>\n<td>200+ رحلة<\/td>\n<td>100 – 199 رحلة<\/td>\n<td>50 – 99 رحلة<\/td>\n<td>أقل من 50 رحلة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>سقف التعويض<\/td>\n<td>بدون سقف — صعّد للـ TL<\/td>\n<td>حتى 8 دنانير<\/td>\n<td>حتى 5 دنانير<\/td>\n<td>الحدود المعتادة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>رسوم الإلغاء<\/td>\n<td>إعفاء دائم + اعتذار<\/td>\n<td>إعفاء دائم<\/td>\n<td>أول نزاع: إعفاء<\/td>\n<td>تُطبَّق حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>أولوية الشكوى<\/td>\n<td>حرجة — TL فوراً<\/td>\n<td>عالية جداً<\/td>\n<td>عالية<\/td>\n<td>عادية<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>الأسلوب واللغة<\/td>\n<td>احتفاظ بالعميل أولاً<\/td>\n<td>تعاطف وأولوية<\/td>\n<td>ودود واهتمام<\/td>\n<td>مهني<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>مكالمة متابعة<\/td>\n<td>خلال نفس الشيفت<\/td>\n<td>خلال 24 ساعة<\/td>\n<td>إذا لزم<\/td>\n<td>إذا لزم<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>فهرس المحتويات<\/strong><\/p>\n", "sops": [{"num": "1", "title": "طلبات بدء الرحلة (مكالمات واردة)", "body": "<p><strong>1. الغرض<\/strong><\/p>\n<p>وضع إجراء موحد للتعامل مع المكالمات الواردة التي تطلب بدء رحلة، مع ضمان التحقق الصحيح والتوجيه الصحيح بحسب نوع المتصل.<\/p>\n<p><strong>3. الإجراء<\/strong><\/p>\n<p><strong>الخطوة الأولى: تحديد هوية المتصل<\/strong><\/p>\n<p>عند استقبال المكالمة الواردة، حدد ما إذا كان المتصل عميلاً أم كابتن.<\/p>\n<p><strong>الخطوة الثانية: التعامل مع مكالمات العميل<\/strong><\/p>\n<p>• أبلغ العميل بأنك ستتواصل مع الكابتن لتنفيذ الطلب.<\/p>\n<p>• أنهِ المكالمة الواردة مع العميل.<\/p>\n<p>• أجرِ مكالمة صادرة (OB) للكابتن المعيَّن لبدء الرحلة.<\/p>\n<p><strong>الخطوة الثالثة: التعامل مع مكالمات الكابتن<\/strong><\/p>\n<p><strong>تأكيد الهوية:<\/strong> اطلب من الكابتن تأكيد اسمه.<\/p>\n<p><strong>التحقق من وجود العميل:<\/strong> اسأل الكابتن إن كان العميل داخل المركبة.<\/p>\n<p><strong>إذا كانت الإجابة نعم:<\/strong> اطلب رمز الرحلة أو آخر 3 أرقام من هاتف العميل.<\/p>\n<p><strong>إذا كانت الإجابة لا:<\/strong> ابدأ الرحلة مع الإشارة إلى أنها تحت مسؤولية الكابتن.<\/p>\n<p><strong>4. مخطط المرجع السريع<\/strong><\/p>\n<p>• المتصل = عميل ← أنهِ المكالمة ← اتصل بالكابتن (OB) ← ابدأ الرحلة<\/p>\n<p>• المتصل = كابتن ← تأكيد الاسم ← هل العميل حاضر؟<\/p>\n<p>• نعم ← احصل على رمز/هاتف ← ابدأ الرحلة<\/p>\n<p>• لا ← ابدأ الرحلة (تحت مسؤولية الكابتن)<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>طلب بدء الرحلة<\/td>\n<td>لا تأخير — اعتذر عن أي انتظار<\/td>\n<td>أولوية — ابدأ الرحلة فوراً<\/td>\n<td>الإجراء المعتاد<\/td>\n<td>الإجراء المعتاد<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>الكابتن لا يستجيب<\/td>\n<td>OB مرتين + تنبيه TL فوري إذا لم يُحل<\/td>\n<td>OB مرتين + ملاحظة على الكابتن<\/td>\n<td>OB مرتين<\/td>\n<td>OB مرتين<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>العميل ينتظر طويلاً<\/td>\n<td>اعتذر + تعويض إذا تجاوز الانتظار 5 دقائق<\/td>\n<td>اعتذر + تحديث حالة<\/td>\n<td>اعتذر وحدّث<\/td>\n<td>أبلغه وانتظر<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "2", "title": "طلبات تأكيد الوصول", "body": "<p><strong>1. الغرض<\/strong><\/p>\n<p>وضع إجراء موحد للتعامل مع مكالمات تأكيد وصول الكابتن وبدء الرحلة في نقطة الالتقاء.<\/p>\n<p><strong>3. الإجراء<\/strong><\/p>\n<p><strong>الخطوة الأولى: التحقق من وجود العميل<\/strong><\/p>\n<p>عند استقبال طلب تأكيد الوصول، اسأل الكابتن فوراً: \"هل العميل معك؟\"<\/p>\n<p><strong>إذا كانت الإجابة نعم:<\/strong> تابع فوراً إجراء بدء الرحلة: تأكيد الاسم ← رمز/هاتف ← ابدأ الرحلة.<\/p>\n<p><strong>إذا كانت الإجابة لا:<\/strong> ارفض الطلب بأدب وأبلغ الكابتن بضرورة وجود العميل في المركبة وأنهِ المكالمة.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>الكابتن ينتظر عميل VIP<\/td>\n<td>اتصل فوراً + اعرض تعويض انتظار للكابتن<\/td>\n<td>اتصل بعميل VIP استباقياً<\/td>\n<td>تواصل مع العميل للتأكد<\/td>\n<td>معتاد<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>العميل لم يصل بعد<\/td>\n<td>OB للعميل + أبلغ الكابتن + تعويض إذا تأخر<\/td>\n<td>OB للعميل لمعرفة ETA<\/td>\n<td>فحص سريع<\/td>\n<td>انتظر حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "3", "title": "طلبات إنهاء الرحلة (مكالمات واردة)", "body": "<p><strong>1. الغرض<\/strong><\/p>\n<p>وضع إجراء موحد للتعامل مع المكالمات الواردة التي تطلب إنهاء رحلة جارية مع تأكيد الأجرة النهائية.<\/p>\n<p><strong>3. الإجراء<\/strong><\/p>\n<p><strong>الخطوة الأولى: تحديد هوية المتصل<\/strong><\/p>\n<p>حدد ما إذا كان المتصل عميلاً أم كابتناً.<\/p>\n<p><strong>الخطوة الثانية: التعامل مع مكالمات العميل<\/strong><\/p>\n<p>• أبلغه بأن الكابتن يجب أن يكون جزءاً من عملية إنهاء الرحلة.<\/p>\n<p>• اطلب من العميل إعطاء الهاتف للكابتن أو أجرِ مكالمة صادرة للكابتن مباشرةً.<\/p>\n<p><strong>الخطوة الثالثة: التعامل مع مكالمات الكابتن<\/strong><\/p>\n<p><strong>تأكيد الهوية:<\/strong> أكّد اسم الكابتن.<\/p>\n<p><strong>تحديد السبب:<\/strong> اسأل عن سبب طلب إنهاء الرحلة.<\/p>\n<p><strong>التحقق من تفاصيل الرحلة:<\/strong> أكّد نقطة الانطلاق، وجهة الوصول، والمسار.<\/p>\n<p><strong>إنهاء الرحلة:<\/strong> نفّذ إنهاء الرحلة في النظام.<\/p>\n<p><strong>تأكيد الأجرة:<\/strong> أبلغ الكابتن بالسعر النهائي.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>نزاع الأجرة عند إنهاء الرحلة<\/td>\n<td>عدّل الأجرة فوراً — رضا العميل أولاً<\/td>\n<td>راجع + عدّل إذا كان مبرراً<\/td>\n<td>راجع + اعتذر<\/td>\n<td>تحقق حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>تحصيل زائد من الكابتن<\/td>\n<td>بدون سقف — استرداد كامل + تصعيد الكابتن<\/td>\n<td>حتى 8 دنانير<\/td>\n<td>حتى 5 دنانير<\/td>\n<td>تحقق (حد أقصى 3 دنانير)<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "4", "title": "مشكلات \"عدم وجود فاتورة\" (مكالمات الكابتن)", "body": "<p><strong>3. الإجراء<\/strong><\/p>\n<p><strong>الخطوة الأولى: تأكيد الهوية<\/strong><\/p>\n<p>ابدأ دائماً بتأكيد اسم الكابتن.<\/p>\n<p><strong>الخطوة الثانية: تحديد السيناريو<\/strong><\/p>\n<p><strong>السيناريو أ – رحلة عادية (العميل موجود):<\/strong> اطلب من الكابتن تفصيل المسار ← اضغط 'إعادة إنشاء الفاتورة' ← أدخل KM ← احفظ.<\/p>\n<p><strong>السيناريو ب – رحلة عادية (العميل غير موجود):<\/strong> احسب الأجرة ← سجّل المسار ← أعِد إنشاء الفاتورة ← OB العميل ← تحقق من المبلغ المدفوع ← اخصم العمولة.<\/p>\n<p><strong>السيناريو ج – رحلة فيزا (العميل لا يُجيب):<\/strong> احسب الأجرة ← OB العميل مرتين ← إذا لم يُجب: عوّض الكابتن واخصم العمولة.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>حل نزاع الفاتورة<\/td>\n<td>حل فوري — لا تأخير للعملاء Elite<\/td>\n<td>أولوية في نفس المكالمة<\/td>\n<td>معتاد<\/td>\n<td>الجداول الزمنية المعتادة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>العميل غير متاح<\/td>\n<td>OB x3 + تنبيه TL + تعويض الكابتن فوراً<\/td>\n<td>OB x3 قبل الإغلاق<\/td>\n<td>ملاحظة على الحساب<\/td>\n<td>انتظر حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "5", "title": "مشكلات البدء والإنهاء (مكالمات واردة)", "body": "<p><strong>3. الإجراء<\/strong><\/p>\n<p>تحديد المتصل (كابتن أم عميل) ← تطبيق المسار المناسب:<\/p>\n<p><strong>مكالمات الكابتن<\/strong><\/p>\n<p><strong>تأكيد الهوية:<\/strong> أكّد اسم الكابتن.<\/p>\n<p><strong>تحديد السبب:<\/strong> اسأل عن سبب الإنهاء المبكر للرحلة.<\/p>\n<p><strong>التعليمات:<\/strong> أخبر الكابتن بانتظار وقبول طلب رحلة جديد من العميل.<\/p>\n<p><strong>متابعة التذكرة:<\/strong> أسند التذكرة لنفسك لمتابعة ما إذا كان العميل يحجز رحلة أخرى.<\/p>\n<p>• العميل يحجز رحلة جديدة ← اعكس العمولة الإدارية للرحلة الأولى<\/p>\n<p>• العميل لا يحجز ← تابع مع الطرفين (رحلة خارج التطبيق)<\/p>\n<p><strong>مكالمات العميل<\/strong><\/p>\n<p><strong>تأكيد الهوية:<\/strong> أكّد اسم العميل.<\/p>\n<p><strong>جمع التفاصيل:<\/strong> اسأل عن سبب الإنهاء والمبلغ المدفوع.<\/p>\n<p><strong>التحقيق:<\/strong> قارن موقع الإنزال بنقطة انطلاق الرحلة التالية مع الفترة الزمنية.<\/p>\n<p>• غش مشتبه به ← صعّد التذكرة فوراً<\/p>\n<p>• لا غش ← OB الكابتن ← صعّد للتحقيق<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>إنهاء رحلة مبكر — غش مشتبه<\/td>\n<td>TL يتولى مباشرة — لا تصعيد تلقائي بدون مراجعة TL<\/td>\n<td>إشعار TL قبل التصعيد<\/td>\n<td>تصعيد حسب السياسة<\/td>\n<td>تصعيد حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>عكس العمولة<\/td>\n<td>طبّق + OB للعميل للتأكد من رضاه<\/td>\n<td>طبّق + اتصل استباقياً بالعميل<\/td>\n<td>طبّق + ملاحظة مجاملة للعميل<\/td>\n<td>طبّق إذا أعاد الحجز<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "6", "title": "إلغاء رحلة نشطة قبل الوصول (العميل)", "body": "<p><strong>3. الإجراء<\/strong><\/p>\n<p><strong>السيناريو أ – الكابتن يبتعد:<\/strong> تأكيد اسم العميل ← التحقق من الخريطة المباشرة ← إلغاء الرحلة (الرسوم على الكابتن).<\/p>\n<p><strong>السيناريو ب – هاتف الكابتن غير متاح:<\/strong> تأكيد الاسم ← تعليق العميل ← OB الكابتن ← تحقق من حالة الهاتف (مغلق/غير متصل/لا يُجيب مرتين) ← إلغاء الرحلة (الرسوم على الكابتن).<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل ق
