بل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>رسوم الإلغاء (خطأ العميل)<\/td>\n<td>إعفاء دائم + اعتذار + رصيد محفظة<\/td>\n<td>إعفاء دائم<\/td>\n<td>إعفاء أول نزاع شهرياً<\/td>\n<td>تُطبَّق حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>الكابتن لا يستجيب<\/td>\n<td>OB مرتين + تصعيد TL + تعويض كامل<\/td>\n<td>OB مرتين + تنبيه TL فوري + تعويض VIP<\/td>\n<td>OB مرتين + تنبيه الكابتن<\/td>\n<td>OB مرتين ← إلغاء<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>انتظار طويل<\/td>\n<td>تعويض كامل + اعتذار شخصي من TL<\/td>\n<td>اعتذر + تعويض<\/td>\n<td>اعتذر + حدّث<\/td>\n<td>أبلغه وانتظر<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "7", "title": "إلغاء رحلة نشطة بعد الوصول", "body": "<p><strong>الجزء أ: المتصل هو الكابتن<\/strong><\/p>\n<p>تأكيد الهوية ← تحديد السبب ← تطبيق مصفوفة سياسة الشركة:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>سبب الكابتن<\/strong><\/td>\n<td><strong>مقبول؟<\/strong><\/td>\n<td><strong>الرسوم<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>إطار مسطوح<\/strong><\/td>\n<td>لا<\/td>\n<td>رسوم تُطبَّق<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>رفض الوجهة أو طريقة الدفع<\/strong><\/td>\n<td>لا<\/td>\n<td>رسوم تُطبَّق<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>وصل لموقع مختلف<\/strong><\/td>\n<td>لا<\/td>\n<td>رسوم تُطبَّق<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>عميل قاصر / أمتعة زائدة<\/strong><\/td>\n<td>نعم<\/td>\n<td>بدون رسوم<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>سلوك العميل سيء<\/strong><\/td>\n<td>نعم<\/td>\n<td>بدون رسوم<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>الطريق مقفل<\/strong><\/td>\n<td>نعم<\/td>\n<td>بدون رسوم<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>الجزء ب: المتصل هو العميل<\/strong><\/p>\n<p>تعليق العميل ← OB الكابتن للحصول على روايته ← تطبيق مصفوفة المستخدم.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>رسوم الإلغاء (خطأ الكابتن)<\/td>\n<td>إعفاء + تعويض + مراجعة الكابتن<\/td>\n<td>إعفاء + رصيد محفظة للعميل<\/td>\n<td>إعفاء — رسوم على الكابتن<\/td>\n<td>إعفاء — رسوم على الكابتن<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>رسوم الإلغاء (خطأ العميل)<\/td>\n<td>إعفاء دائم + بادرة حسن نية<\/td>\n<td>إعفاء دائم<\/td>\n<td>أول نزاع: إعفاء<\/td>\n<td>تُطبَّق حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>نزاعات الإلغاء<\/td>\n<td>دائماً لصالح العميل — صعّد إذا لزم<\/td>\n<td>حل لصالح العميل<\/td>\n<td>أعطِ العميل الفائدة<\/td>\n<td>تحقق عادي<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "8", "title": "مشكلات تقليص المسافة (مكالمات الكابتن)", "body": "<p>تأكيد اسم الكابتن ← تحليل بيانات المسار (المسافة والوقت المسجّلان مقابل GPS الفعلي).<\/p>\n<p>السيناريو أ – العميل موجود: أعِد الاحتساب ← منح العميل خيار الفاتورة. إذا رفض سعراً أعلى: ملاحظة تحذيرية. إذا كانت هناك ملاحظة سابقة: صعّد للحجب.<\/p>\n<p>السيناريو ب – العميل غير موجود: علّق الكابتن ← OB العميل ← بناءً على إجابته: عدّل الفاتورة أو سجّل ملاحظة عقوبة.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>نزاع الأجرة<\/td>\n<td>تحقق حسب السياسة<\/td>\n<td>أعطِ فائدة الشك<\/td>\n<td>قبول رواية العميل — عدّل الأجرة<\/td>\n<td>عدّل فوراً — لا استجواب<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ملاحظة على ملف VIP<\/td>\n<td>أضف إذا ثبت<\/td>\n<td>ملاحظة تحذيرية فقط<\/td>\n<td>لا تضف بدون موافقة TL<\/td>\n<td>لا تضف أبداً — TL يراجع منفرداً<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "9", "title": "مشكلات زيادة المسافة", "body": "<p>الجزء أ (الكابتن): تأكيد الهوية ← قارن المسافة بالمسار القياسي. إذا كان العميل داخل المركبة: أعِد الاحتساب باستخدام 'تعديل الفاتورة'.<\/p>\n<p>الجزء ب (العميل): تأكيد الهوية ← قارن المسافة. العميل موجود: عدّل الفاتورة ← أبلغ الكابتن والعميل بالمبلغ المحدّث. العميل غير موجود: احسب يدوياً ← OB الكابتن. إذا دفع 'السعر العادل': عدّل عمولة الكابتن. إذا دفع الفاتورة الكاملة: عوّض العميل.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>تعويض زيادة المسافة<\/td>\n<td>تحقق + حد أقصى 3 دنانير<\/td>\n<td>حتى 5 دنانير<\/td>\n<td>حتى 8 دنانير<\/td>\n<td>استرداد كامل — بدون سقف — بدون أسئلة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>فائدة الشك<\/td>\n<td>كلا الطرفين تحت التحقيق<\/td>\n<td>ميّل لصالح العميل<\/td>\n<td>قبول رواية العميل<\/td>\n<td>دائماً لصالح العميل<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "10", "title": "مشكلات المسار الطويل", "body": "<p>الجزء أ (العميل): السيناريو 1 (العميل اختار المسار): يجب دفع الفاتورة كاملة. أول مرة: تعويض مجاملة + ملاحظة. تكرار: لا تعويض. السيناريو 2 (الكابتن يُقرّ، لا ملاحظات): عوّض العميل واخصم من الكابتن. السيناريو 3 (الكابتن ينفي، أول مخالفة): عوّض العميل حد أقصى 1 دينار + ملاحظة تحذيرية. السيناريو 4 (ينفي، مخالف متكرر): عوّض + صعّد فوراً.<\/p>\n<p>الجزء ب (الكابتن): تغيير المسار بإذن العميل: الكابتن يجمع الفاتورة الكاملة. انحراف بسبب الطريق/الخريطة: إذا لم يدفع العميل: عوّض الكابتن. إذا دفع الكامل: عوّض العميل بالفرق.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>شكوى مسار طويل<\/td>\n<td>تحقق حسب السياسة<\/td>\n<td>تعويض حتى 5 دنانير<\/td>\n<td>تعويض حتى 8 دنانير — بدون استجواب<\/td>\n<td>استرداد كامل المبلغ الإضافي فوراً<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ملاحظة على الكابتن للمخالفة المتكررة<\/td>\n<td>أضف إذا ثبت<\/td>\n<td>أضف مع إشعار TL<\/td>\n<td>قرار TL مطلوب<\/td>\n<td>لا تضف — TL يراجع منفرداً<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "11", "title": "رحلات المسار القصير (الإنهاء المبكر)", "body": "<p>تأكيد هوية المتصل ← التحقيق في السبب ← تطبيق مصفوفة سياسة الشركة (راجع السياسة لمعرفة من يتحمل الفاتورة).<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>رسوم الرحلة المُنهاة بسبب الكابتن<\/td>\n<td>لا رسوم حسب السياسة<\/td>\n<td>لا رسوم + ملاحظة على الكابتن<\/td>\n<td>لا رسوم + ملاحظة + تنبيه QA<\/td>\n<td>لا رسوم + تعويض العميل + تصعيد TL<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "12", "title": "شكاوى المبالغ الإضافية (الفوترة الزائدة)", "body": "<p>تأكيد الهوية ← جمع التفاصيل ← تعليق العميل ← OB الكابتن للتحقيق.<\/p>\n<p>السيناريو أ (الكابتن يُقرّ): خصم من محفظته ← تأكيد التعويض للعميل ← تصعيد التذكرة.<\/p>\n<p>السيناريو ب (ينفي، لا ملاحظات): صعّد ← فحص ملف العميل ← إذا نظيف: تعويض حد أقصى 3 دنانير + ملاحظة مفصّلة.<\/p>\n<p>السيناريو ج (ينفي، الكابتن لديه ملاحظات): تعويض العميل من جهتنا ← تصعيد فوري لإجراء تأديبي.<\/p>\n<p>السيناريو د (ينفي، العميل لديه ملاحظات): صعّد ← فحص السجل ← أبلغ العميل بعدم إمكانية اتخاذ إجراء الآن.<\/p>\n<p>معاملة معتادة<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>مبلغ التعويض<\/td>\n<td>حد أقصى 3 دنانير<\/td>\n<td>حتى 5 دنانير<\/td>\n<td>حتى 8 دنانير<\/td>\n<td>المبلغ كاملاً — بدون سقف — حل فوري<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>الكابتن ينفي (لا ملاحظات)<\/td>\n<td>3 دنانير + ملاحظة<\/td>\n<td>5 دنانير + ملاحظة<\/td>\n<td>8 دنانير + ملاحظة<\/td>\n<td>استرداد كامل + اعتذار + تصعيد الكابتن<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>العميل لديه ملاحظات سابقة<\/td>\n<td>لا تعويض<\/td>\n<td>مراجعة + مجاملة صغيرة<\/td>\n<td>مراجعة دقيقة — ميّل للعميل<\/td>\n<td>تعويض مع إشعار TL<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "13", "title": "مطالبات المبالغ غير المدفوعة", "body": "<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>العميل لا يدفع<\/td>\n<td>OB + ملاحظة + تعويض كابتن<\/td>\n<td>OB + ملاحظة + تعويض<\/td>\n<td>OB x3 + ملاحظة + تعويض + إشعار TL<\/td>\n<td>عوّض الكابتن فوراً + TL يراجع حساب VIP<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>قرار حجب الحساب<\/td>\n<td>حسب السياسة<\/td>\n<td>يتطلب موافقة TL<\/td>\n<td>يتطلب موافقة TL<\/td>\n<td>لا تحجب بدون موافقة TL<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "14", "title": " lass=\"odd\">\n<td><strong>Ticketing System - Missing info<\/strong><\/td>\n<td>معلومات ناقصة/غير واضحة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Ticketing System - Price complaint<\/strong><\/td>\n<td>شكوى عن السعر<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "39", "title": "المكالمة الصادرة – رحلة فاخرة (العميل)", "body": "<p><strong>3. الإجراء<\/strong><\/p>\n<p>الخطوة 1: OB للعميل. أكّد مواقع الانطلاق/الوصول وعدد الركاب والأمتعة.<\/p>\n<p>الخطوة 2: أبلغ العميل بحدود سعة المركبة الفاخرة: الحد الأقصى 6 أشخاص و2 حقيبة. كل حقيبة إضافية تقلل عدد الأشخاص.<\/p>\n<p>الخطوة 3: احسب أجرة الرحلة وأبلغ العميل بالتكلفة الإجمالية.<\/p>\n<p>الخطوة 4: إذا وافق: أرسل تفاصيل Cliq. إذا رفض: أنهِ المكالمة بأدب وأغلق التذكرة.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>حجز رحلة فاخرة<\/td>\n<td>تقديم مساعدة حجز شخصية + اعتبار ترقية مجانية<\/td>\n<td>حجز أولوية + ترقية مجانية إذا توفرت<\/td>\n<td>حجز أولوية<\/td>\n<td>الإجراء المعتاد<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>مرونة التسعير<\/td>\n<td>TL يمكنه الموافقة على تسعير ترويجي للاحتفاظ بالعميل<\/td>\n<td>استشر TL لأي تعديلات<\/td>\n<td>تسعير ثابت<\/td>\n<td>تسعير ثابت<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "40", "title": "المكالمة الصادرة – حجز رحلة (الرحلات المجدوَلة)", "body": "<p><strong>3. الإجراء<\/strong><\/p>\n<p><strong>السيناريو أ – العميل يُجيب:<\/strong> أكّد رغبته في الرحلة ← اتصل بالكابتن. إذا قَبِل: وجّهه للموقع. إذا رفض: أعِد تعيين كابتن جديد.<\/p>\n<p><strong>السيناريو ب – العميل لا يُجيب:<\/strong> OB الكابتن مباشرةً. إذا قَبِل: وجّهه. إذا رفض: أعِد التعيين. إذا لم يُجب الكابتن أيضاً: ألغِ الرحلة.<\/p>\n<p><strong>5. التعامل حسب فئة الربح<\/strong><\/p>\n<p>تحقق من شيئين في ملف العميل قبل المتابعة: (1) فئة الربح — تُحدَّد تلقائياً من النظام. (2) عدد الرحلات — إذا كان 500 رحلة أو أكثر، طبّق معاملة 'ربح جيد' بغض النظر عن فئة الربح. إذا اجتمع الشرطان (ربح جيد + 500 رحلة): أولوية قصوى.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>الجانب<\/strong><\/th>\n<th><strong>💚 ربح جيد<\/strong><\/th>\n<th><strong>🟢 ربح متوسط<\/strong><\/th>\n<th><strong>🟠 ربح منخفض<\/strong><\/th>\n<th><strong>🔴 ربح منخفض جداً<\/strong><\/th>\n<th><strong>⚫ خسارة<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>مكالمة تأكيد قبل الرحلة<\/td>\n<td>OB قبل ساعة + تأكيد كل التفاصيل + TL يراقب<\/td>\n<td>OB قبل 45 دقيقة + تأكيد تفاصيل الكابتن<\/td>\n<td>OB قبل 30 دقيقة<\/td>\n<td>معتاد<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>عدم ظهور الكابتن/إلغاؤه<\/td>\n<td>إعادة تعيين &lt; 5 دقائق + رصيد محفظة + اعتذار شخصي من TL<\/td>\n<td>إعادة تعيين فوري + اعتذار + رصيد محفظة<\/td>\n<td>إعادة تعيين + إبلاغ العميل + اعتذار<\/td>\n<td>إعادة تعيين حسب السياسة<\/td>\n<td>معاملة معتادة<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "41", "title": "مهمة التقييم – مركبة مختلفة", "body": "<p><strong>3. الإجراء<\/strong><\/p>\n<p>راجع إجراء Rating Task المقابل في النسخة الإنجليزية للخطوات التفصيلية.<\/p>\n<p><strong>5. التعامل ح /* ---------------- State ---------------- */
let state = { lang:'en', view:'home', query:'', tier:null, chatOpen:false, sending:false };
let chatHistory = { en:[], ar:[] };

/* ---------------- Helpers ---------------- */
function stripTags(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent||''; }
function catFor(num){ return CATEGORIES.find(c=>num>=c.range[0]&&num<=c.range[1]); }

function processSopBody(html){
  const wrap = document.createElement('div');
  wrap.innerHTML = html;

  // section headers "N. Title"
  wrap.querySelectorAll('p').forEach(p=>{
    const strong = p.querySelector('strong');
    if(strong && p.children.length===1 && /^\s*\d+\.\s/.test(strong.textContent)){
      p.classList.add('sec-head');
    }
  });

  // tables: warning banners vs tier tables vs plain tables
  wrap.querySelectorAll('table').forEach(table=>{
    const rows = table.querySelectorAll('tr');
    const firstRow = rows[0];
    const hasThead = !!table.querySelector('thead');
    if(!hasThead && rows.length===1 && firstRow.children.length===1){
      const banner = document.createElement('div');
      banner.className='alert-banner';
      banner.innerHTML = '<div>'+firstRow.children[0].innerHTML+'</div>';
      table.replaceWith(banner);
      return;
    }
    if(hasThead){
      const ths = Array.from(table.querySelectorAll('thead th'));
      const tierCols = ths.map(th=>{
        const t = th.textContent;
        const found = TIER_META.find(tm=>t.includes(tm.emoji));
        return found ? found.id : 'label';
      });
      const anyTier = tierCols.some(t=>t!=='label');
      if(anyTier){
        table.classList.add('tier-table');
        ths.forEach((th,i)=> th.setAttribute('data-tier', tierCols[i]));
        table.querySelectorAll('tbody tr').forEach(tr=>{
          Array.from(tr.children).forEach((td,i)=> td.setAttribute('data-tier', tierCols[i]||'label'));
        });
      }
    }
    const tw = document.createElement('div');
    tw.className='table-wrap';
    table.replaceWith(tw);
    tw.appendChild(table);
  });

  return wrap.innerHTML;
}

/* ---------------- Rendering ---------------- */
function renderTierStrip(){
  const el = document.getElementById('tier-strip');
  const L = STRINGS[state.lang];
  el.innerHTML = TIER_META.map(tm=>`
    <button class="tier-chip" data-t="${tm.id}" style="--dotc:var(${tm.varc})" onclick="toggleTier('${tm.id}')">

}
function syncTierChips(){
  document.querySelectorAll('.tier-chip').forEach(b=>{

}
function toggleTier(id){

  document.body.classList.remove('spotlight','t-good','t-moderate','t-low','t-verylow','t-loss');
  if(state.tier){ document.body.classList.add('spotlight','t-'+state.tier); }

}

function renderNav(){

/* ---------------- Search ---------------- */

function applySearchFilter(){
  const q = state.query.trim().toLowerCase();
  let anyVisible = {};
  document.querySelectorAll('.cat-block').forEach(block=>{
    let visibleCount = 0;
    block.querySelectorAll('.sop-item').forEach(item=>{
      const match = !q || item.dataset.search.includes(q);
      item.classList.toggle('hidden', !match);
      if(match) visibleCount++;
    });
    block.classList.toggle('hidden', visibleCount===0);
  });
}

function renderChatLog(){
  const log = document.getElementById('chat-log');
  const L = STRINGS[state.lang];
  const hist = chatHistory[state.lang];
  if(hist.length===0){
    log.innerHTML = `<div class="chat-empty">
      <b>${L.emptyChatTitle}</b>
      <div>${L.emptyChatBody}</div>
      <div class="suggest-row">
        <button onclick="askSuggested(0)">${L.s1}</button>
        <button onclick="askSuggested(1)">${L.s2}</button>
        <button onclick="askSuggested(2)">${L.s3}</button>
      </div>
    </div>`;
    return;
  }
  log.innerHTML = hist.map(m=>{
    if(m.role==='user'){
      return `<div class="msg user">${escapeHtml(m.content)}</div>`;
    }
    return `<div class="msg assistant${m.error?' error':''}">${m.html || escapeHtml(m.content)}</div>`;
  }).join('') + (state.sending ? `<div class="msg assistant"><div class="typing"><span></span><span></span><span></span></div></div>` : '');
  log.scrollTop = log.scrollHeight;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------------- Offline search engine ---------------- */
const STOPWORDS_EN = new Set(['the','a','an','is','are','was','were','be','been','to','of','in','on','for','and','or','with','it','this','that','what','who','how','do','does','did','if','my','me','i','we','you','your','he','she','they','them','their','has','have','had','not','no','can','could','should','would','will','shall','at','by','from','as','about','into','out','up','down','over','under','again','than','then','so','just','get','got','when','where','which']);
const STOPWORDS_AR = new Set(['من','في','على','إلى','عن','مع','هل','ما','لا','و','أو','ثم','كان','كانت','هذا','هذه','ذلك','تلك','التي','الذي','أن','إن','كل','بعد','قبل','عند','حتى','قد','لم','لن','كيف','ماذا','أي','أنا','أنت','هو','هي','نحن','هم','له','لها','لهم','يجب','عليه','عليها']);

function tokenize(text, lang){
  const stop = lang==='ar' ? STOPWORDS_AR : STOPWORDS_EN;
  const raw = (text.toLowerCase().match(/[\p{L}\p{N}]+/gu)) || [];
  return raw.filter(w => w.length>1 && !stop.has(w));
}

let SEARCH_INDEX = { en:null, ar:null };
function getIndex(lang){
  if(SEARCH_INDEX[lang]) return SEARCH_INDEX[lang];
  const d = DATA[lang];
  const idx = d.sops.map(s=>{
    const titleText = stripTags(s.title);
    const bodyText = stripTags(s.body);
    return {
      num: +s.num, title: titleText, bodyText,
      titleTokens: tokenize(titleText, lang),
      bodyTokens: tokenize(bodyText, lang)
    };
  });
  SEARCH_INDEX[lang] = idx;
  return idx;
}

function wordsMatch(a, b){
  if(a===b) return true;
  const minLen = Math.min(a.length, b.length);
  if(minLen<4) return false;
  const prefixLen = Math.min(6, minLen);
  return a.slice(0,prefixLen)===b.slice(0,prefixLen);
}

function searchSops(lang, query){
  const idx = getIndex(lang);
  const qTokens = Array.from(new Set(tokenize(query, lang)));
  if(qTokens.length===0) return [];
  const scored = idx.map(item=>{
    let score = 0;
    qTokens.forEach(t=>{
      const titleHits = item.titleTokens.filter(w => wordsMatch(w,t)).length;
      const bodyHits = item.bodyTokens.filter(w => wordsMatch(w,t)).length;
      score += titleHits*5 + Math.min(bodyHits,4);
    });
    return { item, score };
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,4).map(r=>({ ...r.item, snippet: snippetFor(r.item, qTokens) }));
}

function snippetFor(item, qTokens){
  const text = item.bodyText.replace(/\s+/g,' ').trim();
  const lower = text.toLowerCase();
  let hitIdx = -1;
  for(const t of qTokens){ const i = lower.indexOf(t); if(i>=0 && (hitIdx<0 || i<hitIdx)) hitIdx = i; }
  if(hitIdx<0) hitIdx = 0;
  const start = Math.max(0, hitIdx-50);
  const end = Math.min(text.length, hitIdx+150);
  let snippet = text.slice(start,end).trim();
  if(start>0) snippet = '…'+snippet;
  if(end<text.length) snippet = snippet+'…';
  let esc = escapeHtml(snippet);
  qTokens.forEach(t=>{
    if(t.length<2) return;
    const stem = t.slice(0, Math.min(6, t.length)).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re = new RegExp('(\\b'+stem+'[\\p{L}\\p{N}]*)','giu');
    esc = esc.replace(re, '<mark>$1</mark>');
  });
  return esc;
}

function askSuggested(i){
  const L = STRINGS[state.lang];
  const q = [L.s1,L.s2,L.s3][i];
  document.getElementById('chat-input').value = q;
  sendChat();
}

function goToResult(num){
  toggleChat(false);
  openSop(num);
}

function sendChat(){
  if(state.sending) return;
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if(!q) return;
  input.value='';
  const hist = chatHistory[state.lang];
  hist.push({role:'user', content:q});

  const results = searchSops(state.lang, q);
  const L = STRINGS[state.lang];
  if(results.length===0){
    hist.push({role:'assistant', content:L.chatError, error:true});
  }else{
    const html = `<div style="margin-bottom:6px;font-size:11.5px;color:var(--sub-text);">${L.resultsFor} "${escapeHtml(q)}"</div>` +
      results.map(r=>`
        <div class="result-card" onclick="goToResult(${r.num})">
          <span class="rc-badge">${state.lang==='ar'?'الإجراء':'SOP'} ${r.num}</span>
          <div class="rc-title">${escapeHtml(r.title)}</div>
          <div class="rc-snippet">${r.snippet}</div>
        </div>
      `).join('');
    hist.push({role:'assistant', content:'', html});
  }
  renderChatLog();
}

render();
