<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petra Ride — Support Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161c;
  --ink-2:#1b2129;
  --ink-3:#262e38;
  --paper:#f7f4ee;
  --paper-2:#efeadf;
  --card:#fffdf9;
  --line:#e4ddcd;
  --clay:#9c4a2e;
  --clay-dark:#7d3a23;
  --clay-tint:#f1e0d6;
  --teal:#1f6f6b;
  --teal-dark:#155450;
  --teal-tint:#dcefed;
  --ink-text:#1b1f24;
  --sub-text:#5c6470;
  --on-ink:#ece8de;
  --on-ink-dim:#9aa3ac;

  --tier-good:#2f8f5b;
  --tier-good-tint:#e1f2e8;
  --tier-mod:#5aa33c;
  --tier-mod-tint:#eaf3df;
  --tier-low:#c77b1f;
  --tier-low-tint:#f8ecd9;
  --tier-verylow:#c23b3b;
  --tier-verylow-tint:#f8e0e0;
  --tier-loss:#4b4b4b;
  --tier-loss-tint:#e7e7e7;

  --radius:10px;
  --shadow:0 6px 24px rgba(18,22,28,.08);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
html[dir="rtl"]{
  --font-display:'Cairo',sans-serif;
  --font-body:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink-text);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns:300px 1fr;
  min-height:100vh;
}
html[dir="rtl"] .app{ direction:rtl; }

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--ink);
  color:var(--on-ink);
  padding:20px 16px 32px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:4px 4px 12px;
  border-bottom:1px solid rgba(236,232,222,.12);
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(155deg,var(--clay) 0%, var(--clay-dark) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);
  font-weight:700;color:#fff;font-size:15px;
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text .name{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff;}
.brand-text .sub{font-size:11px;color:var(--on-ink-dim);margin-top:2px;}

.lang-toggle{
  display:flex;background:rgba(255,255,255,.06);border-radius:8px;padding:3px;gap:2px;
}
.lang-toggle button{
  flex:1;border:none;background:transparent;color:var(--on-ink-dim);
  font-family:var(--font-body);font-size:12.5px;font-weight:600;padding:7px 6px;border-radius:6px;cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-toggle button.active{background:var(--clay);color:#fff;}

.search-wrap{position:relative;}
.search-wrap input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);
  color:#fff;padding:9px 12px 9px 34px;border-radius:8px;font-size:13px;font-family:var(--font-body);
}
html[dir="rtl"] .search-wrap input{padding:9px 34px 9px 12px;}
.search-wrap input::placeholder{color:var(--on-ink-dim);}
.search-wrap input:focus{outline:2px solid var(--teal);outline-offset:1px;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none;}
html[dir="rtl"] .search-wrap svg{left:auto;right:11px;}

.home-btn{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);color:var(--on-ink);padding:9px 12px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);
}
.home-btn:hover{background:rgba(255,255,255,.1);}
.home-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

nav.sop-nav{display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
.cat-block .cat-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--on-ink-dim);
  font-weight:600;padding:0 6px 6px;
}
.cat-block ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;}
.sop-item{
  display:flex;align-items:baseline;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--on-ink);line-height:1.3;
}
.sop-item:hover{background:rgba(255,255,255,.06);}
.sop-item.active{background:var(--clay);color:#fff;}
.sop-item .n{font-family:var(--font-mono);font-size:11px;color:var(--on-ink-dim);flex-shrink:0;min-width:20px;}
.sop-item.active .n{color:rgba(255,255,255,.75);}
.sop-item.hidden{display:none;}
.cat-block.hidden{display:none;}

/* ---------- Main ---------- */
main{padding:0;min-height:100vh;position:relative;}
.topbar{
  position:sticky;top:0;z-index:5;background:rgba(247,244,238,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.tier-strip{display:flex;gap:6px;flex-wrap:wrap;}
.tier-chip{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--sub-text);
  transition:transform .12s;
}
.tier-chip:hover{transform:translateY(-1px);}
.tier-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tier-chip.active{color:#fff;border-color:transparent;}
.tier-chip[data-t="good"].active{background:var(--tier-good);}
.tier-chip[data-t="moderate"].active{background:var(--tier-mod);}
.tier-chip[data-t="low"].active{background:var(--tier-low);}
.tier-chip[data-t="verylow"].active{background:var(--tier-verylow);}
.tier-chip[data-t="loss"].active{background:var(--tier-loss);}
.tier-hint{font-size:11px;color:var(--sub-text);}

.content{max-width:840px;margin:0 auto;padding:40px 40px 120px;}

.home-hero{margin-bottom:32px;}
.eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--clay);font-weight:600;margin-bottom:10px;display:block;
}
.home-hero h1{
  font-family:var(--font-display);font-size:34px;line-height:1.15;margin:0 0 14px;color:var(--ink-text);
  letter-spacing:-.01em;
}
.home-hero p.lead{font-size:15.5px;color:var(--sub-text);line-height:1.6;max-width:60ch;margin:0 0 20px;}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-width:110px;}
.stat b{display:block;font-family:var(--font-display);font-size:22px;color:var(--clay-dark);}
.stat span{font-size:11.5px;color:var(--sub-text);}

.ask-cta{
  display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--teal);color:#fff;
  border-radius:var(--radius);padding:18px 22px;margin-bottom:32px;box-shadow:var(--shadow);
}
.ask-cta div h3{margin:0 0 4px;font-family:var(--font-display);font-size:17px;}
.ask-cta div p{margin:0;font-size:13px;opacity:.85;max-width:44ch;}
.ask-cta button{
  background:#fff;color:var(--teal-dark);border:none;padding:10px 18px;border-radius:8px;font-weight:700;
  font-size:13.5px;cursor:pointer;white-space:nowrap;flex-shrink:0;
}

.sop-header{margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--ink);}
.sop-header .badge{
  font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--clay-dark);
  background:var(--clay-tint);padding:3px 9px;border-radius:5px;display:inline-block;margin-bottom:10px;
}
.sop-header h1{font-family:var(--font-display);font-size:27px;line-height:1.25;margin:0;color:var(--ink-text);letter-spacing:-.005em;}

.sop-body p{font-size:14.5px;line-height:1.68;color:var(--ink-text);margin:0 0 14px;}
.sop-body p.sec-head{
  font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--teal-dark);font-weight:600;margin:28px 0 10px;padding-top:4px;
}
.sop-body p.sec-head:first-child{margin-top:0;}
.sop-body p.sec-head strong{font-weight:600;}
.sop-body blockquote{
  margin:0 0 16px;padding:4px 0 4px 18px;border-left:3px solid var(--clay);
}
html[dir="rtl"] .sop-body blockquote{border-left:none;border-right:3px solid var(--clay);padding:4px 18px 4px 0;}
.sop-body blockquote p{margin:0 0 9px;font-size:14px;}
.sop-body blockquote p:last-child{margin-bottom:0;}
.sop-body strong{font-weight:600;color:var(--ink-text);}

.alert-banner{
  display:flex;gap:10px;align-items:flex-start;background:var(--clay-tint);border:1px solid #e3c3b0;
  color:var(--clay-dark);padding:12px 16px;border-radius:9px;font-size:13px;line-height:1.55;margin:0 0 20px;font-weight:500;
}
.alert-banner strong{color:var(--clay-dark);}

.table-wrap{overflow-x:auto;margin:0 0 22px;border-radius:9px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:12.8px;}
table th,table td{
  padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  vertical-align:top;line-height:1.5;
}
html[dir="rtl"] table th, html[dir="rtl"] table td{text-align:right;}
table tr>*:last-child{border-right:none;}
table thead th{background:var(--ink);color:var(--on-ink);font-weight:600;font-size:12px;white-space:nowrap;}
table tbody tr:last-child td{border-bottom:none;}
table td strong, table th strong{font-weight:600;}

table.tier-table td[data-tier="good"], table.tier-table th[data-tier="good"]{background:var(--tier-good-tint);}
table.tier-table td[data-tier="moderate"], table.tier-table th[data-tier="moderate"]{background:var(--tier-mod-tint);}
table.tier-table td[data-tier="low"], table.tier-table th[data-tier="low"]{background:var(--tier-low-tint);}
table.tier-table td[data-tier="verylow"], table.tier-table th[data-tier="verylow"]{background:var(--tier-verylow-tint);}
table.tier-table td[data-tier="loss"], table.tier-table th[data-tier="loss"]{background:var(--tier-loss-tint);}
table.tier-table thead th[data-tier]{background:var(--ink);}

body.spotlight table.tier-table td, body.spotlight table.tier-table th{opacity:.28;filter:grayscale(.4);transition:opacity .18s,filter .18s;}
body.spotlight table.tier-table td[data-tier="label"], body.spotlight table.tier-table th[data-tier="label"]{opacity:1;filter:none;}
body.spotlight.t-good table.tier-table [data-tier="good"],
body.spotlight.t-moderate table.tier-table [data-tier="moderate"],
body.spotlight.t-low table.tier-table [data-tier="low"],
body.spotlight.t-verylow table.tier-table [data-tier="verylow"],
body.spotlight.t-loss table.tier-table [data-tier="loss"]{opacity:1;filter:none;outline:2px solid var(--ink);outline-offset:-2px;}

.no-results{color:var(--sub-text);font-size:13.5px;padding:6px;}

/* ---------- Chat ---------- */
.chat-fab{
  position:fixed;bottom:26px;right:26px;z-index:40;background:var(--teal);color:#fff;border:none;
  width:58px;height:58px;border-radius:50%;box-shadow:0 8px 24px rgba(31,111,107,.4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
html[dir="rtl"] .chat-fab{right:auto;left:26px;}
.chat-fab:hover{transform:scale(1.06);}
.chat-drawer{
  position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;background:var(--card);
  box-shadow:-12px 0 32px rgba(0,0,0,.18);z-index:50;display:flex;flex-direction:column;
  --closed-x:105%;
  transform:translateX(var(--closed-x));transition:transform .25s ease;
}
html[dir="rtl"] .chat-drawer{right:auto;left:0;box-shadow:12px 0 32px rgba(0,0,0,.18);--closed-x:-105%;}
.chat-drawer.open{transform:translateX(0);}
.chat-head{
  background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.chat-head .t{display:flex;align-items:center;gap:9px;}
.chat-head .t b{font-family:var(--font-display);font-size:15px;}
.chat-head .t span{display:block;font-size:11px;color:var(--on-ink-dim);}
.chat-head .dot-live{width:7px;height:7px;border-radius:50%;background:#4bd18a;box-shadow:0 0 0 3px rgba(75,209,138,.25);}
.chat-close{background:transparent;border:none;color:#fff;opacity:.7;cursor:pointer;padding:4px;}
.chat-close:hover{opacity:1;}
.result-card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;
}
.result-card:hover{border-color:var(--teal);}
.result-card .rc-badge{
  font-family:var(--font-mono);font-size:10.5px;color:var(--clay-dark);background:var(--clay-tint);
  padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:5px;font-weight:600;
}
.result-card .rc-title{font-family:var(--font-display);font-size:13.5px;font-weight:600;color:var(--ink-text);margin-bottom:4px;}
.result-card .rc-snippet{font-size:12px;color:var(--sub-text);line-height:1.5;}
.result-card mark{background:var(--teal-tint);color:var(--teal-dark);border-radius:3px;padding:0 2px;font-weight:600;}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:88%;padding:10px 13px;border-radius:11px;font-size:13.5px;line-height:1.55;}
.msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:3px;}
html[dir="rtl"] .msg.user{align-self:flex-start;border-bottom-right-radius:11px;border-bottom-left-radius:3px;}
.msg.assistant{align-self:flex-start;background:var(--paper-2);color:var(--ink-text);border-bottom-left-radius:3px;}
html[dir="rtl"] .msg.assistant{align-self:flex-end;border-bottom-left-radius:11px;border-bottom-right-radius:3px;}
.msg.assistant p{margin:0 0 8px;}
.msg.assistant p:last-child{margin-bottom:0;}
.msg.assistant strong{font-weight:600;}
.msg.error{background:var(--tier-verylow-tint);color:var(--tier-verylow);}
.chat-empty{color:var(--sub-text);font-size:13px;padding:8px 4px;line-height:1.6;}
.chat-empty b{display:block;color:var(--ink-text);font-family:var(--font-display);font-size:15px;margin-bottom:6px;}
.suggest-row{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.suggest-row button{
  text-align:left;background:var(--card);border:1px solid var(--line);padding:8px 11px;border-radius:8px;
  font-size:12.5px;color:var(--ink-text);cursor:pointer;font-family:var(--font-body);
}
html[dir="rtl"] .suggest-row button{text-align:right;}
.suggest-row button:hover{border-color:var(--teal);}
.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--sub-text);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:.8;}}
.chat-input-row{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;}
.chat-input-row textarea{
  flex:1;resize:none;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--font-body);
  font-size:13.5px;max-height:100px;background:var(--paper);
}
.chat-input-row textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
.chat-input-row button{
  background:var(--teal);color:#fff;border:none;width:40px;border-radius:9px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.chat-input-row button:disabled{opacity:.5;cursor:default;}

.scrim{position:fixed;inset:0;background:rgba(18,22,28,.35);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.show{opacity:1;pointer-events:auto;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:99px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);}

@media (max-width:880px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;}
  .content{padding:28px 20px 100px;}
  .topbar{padding:12px 20px;}
  .chat-drawer{width:100%;max-width:100%;}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">PR</div>
      <div class="brand-text">
        <span class="name">Petra Ride</span>
        <span class="sub" data-i="brandSub">Support Ops Manual</span>
      </div>
    </div>
    <div class="lang-toggle">
      <button id="btn-lang-en" onclick="setLang('en')">EN</button>
      <button id="btn-lang-ar" onclick="setLang('ar')">العربية</button>
    </div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" data-ph="searchPh" oninput="onSearch(this.value)">
    </div>
    <button class="home-btn" id="home-btn" onclick="goHome()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i="overview">Overview</span>
    </button>
    <nav class="sop-nav" id="sop-nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <div class="tier-strip" id="tier-strip"></div>
      <div class="tier-hint" data-i="tierHint">Tap a tier to spotlight it</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<button class="chat-fab" id="chat-fab" onclick="toggleChat(true)" aria-label="Ask a question">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</button>

<div class="chat-drawer" id="chat-drawer">
  <div class="chat-head">
    <div class="t">
      <span class="dot-live"></span>
      <div><b data-i="chatTitle">Search the SOP</b><span data-i="chatSub">Instant keyword search — no AI, no internet needed</span></div>
    </div>
    <button class="chat-close" onclick="toggleChat(false)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="chat-log" id="chat-log"></div>
  <div class="chat-input-row">
    <textarea id="chat-input" rows="1" data-ph="chatPh" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendChat();}"></textarea>
    <button onclick="sendChat()" id="chat-send" aria-label="Send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script type="application/json" id="data-en">{"intro": "<p><strong>PETRA RIDE<\/strong><\/p>\n<p><strong>Standard Operating Procedures<\/strong><\/p>\n<p>Customer Support Operations Manual<\/p>\n<p>Version 2.0 | 54 SOPs | Includes VIP Tier Protocols &amp; Kids Ride<\/p>\n<p><strong>Customer Priority Classification: Profit Tier + Trip Count<\/strong><\/p>\n<p>All agents must check the customer's profit tier in the system before handling any complaint. The system automatically assigns each customer a profit tier — no manual calculation needed. The tier determines the handling protocol.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Trip Count<\/td>\n<td>200+ trips<\/td>\n<td>100 – 199 trips<\/td>\n<td>50 – 99 trips<\/td>\n<td>&lt; 50 trips<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Compensation cap<\/td>\n<td>No hard cap — escalate TL<\/td>\n<td>Up to 8 JD<\/td>\n<td>Up to 5 JD<\/td>\n<td>Standard limits<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cancellation fees<\/td>\n<td>Always waive + apology<\/td>\n<td>Always waive<\/td>\n<td>First dispute: waive<\/td>\n<td>Apply per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Complaint priority<\/td>\n<td>CRITICAL — TL immediately<\/td>\n<td>Very High<\/td>\n<td>High<\/td>\n<td>Normal<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tone &amp; language<\/td>\n<td>VIP treatment — retention first<\/td>\n<td>Empathetic &amp; priority<\/td>\n<td>Warm &amp; attentive<\/td>\n<td>Professional<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Follow-up call<\/td>\n<td>Within same shift<\/td>\n<td>Within 24 hrs<\/td>\n<td>If needed<\/td>\n<td>If needed<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Table of Contents<\/strong><\/p>\n", "sops": [{"num": "1", "title": "Start Trip Requests (Inbound Calls)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling inbound calls requesting to start a trip, ensuring proper verification and correct routing based on the caller type.<\/p>\n<p><strong>2. Scope<\/strong><\/p>\n<p>This procedure applies to all support agents receiving Inbound (IB) calls from either Customers or Captains regarding trip initiation.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Identify the Caller<\/strong><\/p>\n<p>Upon receiving the inbound call, establish whether the caller is a Customer or a Captain.<\/p>\n<p><strong>Step 2: Handling Customer Calls<\/strong><\/p>\n<p>If the caller is a Customer:<\/p>\n<blockquote>\n<p>• Politely advise the Customer that you will contact the Captain to process the request.<\/p>\n<p>• End the inbound call with the Customer.<\/p>\n<p>• Initiate an Outbound (OB) call to the assigned Captain to start the trip.<\/p>\n<\/blockquote>\n<p><strong>Step 3: Handling Captain Calls<\/strong><\/p>\n<p>If the caller is a Captain, follow this verification flow:<\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Ask for and confirm the Captain's name.<\/p>\n<p><strong>Verify Customer Presence:<\/strong> Ask the Captain if the customer is currently in the vehicle.<\/p>\n<p><strong>If YES:<\/strong> Ask the Captain to provide either the Trip Code OR the last 3 digits of the customer's registered phone number.<\/p>\n<p><strong>If NO / Details Unavailable:<\/strong> Proceed to start the trip but explicitly note it is being started under the Captain's responsibility.<\/p>\n<\/blockquote>\n<p><strong>4. Quick Reference Flowchart<\/strong><\/p>\n<blockquote>\n<p>• Caller = Customer → End Call → Call Captain (OB) → Start Trip<\/p>\n<p>• Caller = Captain → Confirm Name → Is Customer present?<\/p>\n<p>• Yes → Get Trip Code OR Last 3 Phone Digits → Start Trip<\/p>\n<p>• No / No Info → Start Trip (Under Captain's Responsibility)<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Trip start request<\/td>\n<td>Start trip with no delay — apologize for any wait<\/td>\n<td>Prioritize call — start trip immediately<\/td>\n<td>Standard process<\/td>\n<td>Standard process<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Captain unresponsive<\/td>\n<td>OB attempt x2, immediate TL flag if unresolved<\/td>\n<td>OB attempt x2, note on captain<\/td>\n<td>OB attempt x2<\/td>\n<td>OB attempt x2<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Customer waiting long<\/td>\n<td>Apologize + offer compensation if wait exceeds 5 min<\/td>\n<td>Apologize + offer status update<\/td>\n<td>Apologize &amp; update<\/td>\n<td>Inform &amp; wait<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "2", "title": "Arrival Confirmation Requests", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling calls regarding arrival confirmation and trip initiation at the pickup location.<\/p>\n<p><strong>2. Scope<\/strong><\/p>\n<p>This procedure applies to all support agents receiving calls from Captains requesting to confirm arrival and start the trip.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Verify Customer Presence<\/strong><\/p>\n<p>Upon receiving an arrival confirmation request, immediately ask the Captain: \"Is the customer with you?\"<\/p>\n<p><strong>Step 2: Action Based on Customer Presence<\/strong><\/p>\n<blockquote>\n<p><strong>If YES (Customer is present):<\/strong> Proceed immediately to the standard Start Trip Request procedure: confirm Captain's name, ask for Trip Code or last 3 phone digits, start the trip.<\/p>\n<p><strong>If NO (Customer is not present):<\/strong> Politely refuse the request, advise the Captain that the customer must be present in the vehicle, and end the call.<\/p>\n<\/blockquote>\n<p><strong>4. Quick Reference Flowchart<\/strong><\/p>\n<blockquote>\n<p>• Arrival Confirmation → Ask: \"Is the customer with you?\"<\/p>\n<p>• Yes → Execute Start Trip SOP<\/p>\n<p>• No → Refuse request → End call<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Captain waiting for VIP<\/td>\n<td>Contact VIP immediately + offer wait compensation to captain<\/td>\n<td>Contact VIP customer proactively<\/td>\n<td>Acknowledge &amp; check on VIP<\/td>\n<td>Standard<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Customer not yet arrived<\/td>\n<td>OB to VIP + inform captain + compensate if late<\/td>\n<td>OB to VIP customer to confirm ETA<\/td>\n<td>Brief status check<\/td>\n<td>Wait per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "3", "title": "Ending Trip Requests (Inbound Calls)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling inbound calls requesting to end an ongoing trip, ensuring accurate trip details, proper routing, and final fare confirmation.<\/p>\n<p><strong>2. Scope<\/strong><\/p>\n<p>This procedure applies to all support agents receiving Inbound (IB) calls from Customers or Captains regarding trip termination.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Identify the Caller<\/strong><\/p>\n<p>Establish whether the caller is a Customer or a Captain.<\/p>\n<p><strong>Step 2: Handling Customer Calls<\/strong><\/p>\n<blockquote>\n<p>• Politely advise the Customer that the Captain must be involved to officially end the trip.<\/p>\n<p>• Either request the Customer to hand the phone to the Captain, OR end the inbound call and initiate an OB call directly to the Captain.<\/p>\n<\/blockquote>\n<p><strong>Step 3: Handling Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Ask for and verify the Captain's name.<\/p>\n<p><strong>Determine Reason:<\/strong> Ask the Captain to provide the reason for the end trip request.<\/p>\n<p><strong>Verify Trip Details:<\/strong> Confirm pickup location, final drop-off location, and route taken.<\/p>\n<p><strong>End Trip:<\/strong> Process trip termination in the system.<\/p>\n<p><strong>Confirm Fare:<\/strong> Inform the Captain of the final calculated price for the trip.<\/p>\n<p><strong>Closure:<\/strong> Confirm trip is officially ended and close the call.<\/p>\n<\/blockquote>\n<p><strong>4. Quick Reference Flowchart<\/strong><\/p>\n<blockquote>\n<p>• Caller = Customer → End Call &amp; Call Captain (OB)<\/p>\n<p>• Caller = Captain → Confirm Name → Ask Reason → Verify Pickup/Drop-off &amp; Route → End Trip → Confirm Price → Done<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Fare dispute at trip end<\/td>\n<td>Adjust fare immediately — customer satisfaction first<\/td>\n<td>Review + offer adjustment if justified<\/td>\n<td>Acknowledge + review<\/td>\n<td>Investigate per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Overcharged by captain<\/td>\n<td>No cap — full refund + escalate captain<\/td>\n<td>Compensate up to 8 JD<\/td>\n<td>Compensate up to 5 JD<\/td>\n<td>Investigate (max 3 JD)<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "4", "title": "\"No Bill\" Issues (Captain Calls)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling calls from Captains reporting that no bill was generated at the end of a trip.<\/p>\n<p><strong>2. Scope<\/strong><\/p>\n<p>This procedure applies to all support agents receiving calls from Captains who did not receive a fare bill upon trip completion.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Confirm Identity<\/strong><\/p>\n<p>Always begin by confirming the Captain's name.<\/p>\n<p><strong>Step 2: Identify Scenario &amp; Act<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario A – Normal trip (Customer present):<\/strong> Ask the Captain to detail the full route. Press 'Regenerate Bill' in the system, enter the kilometers, and save.<\/p>\n<p><strong>Scenario B – Normal trip (Customer absent):<\/strong> Calculate the expected fare, record the route, regenerate the bill, OB call the customer to verify cash paid, then deduct admin commission.<\/p>\n<p><strong>Scenario C – Visa trip (Customer absent – answers):<\/strong> Calculate fare, confirm payment status, OB the customer, mediate to align details, deduct commission.<\/p>\n<p><strong>Scenario D – Visa trip (Customer absent – no answer x2):<\/strong> Calculate fare, OB the customer twice, if unanswered: process Captain compensation and deduct commission.<\/p>\n<\/blockquote>\n<p><strong>4. Quick Reference<\/strong><\/p>\n<blockquote>\n<p>• Confirm Captain → Verify customer presence &amp; payment type → Select scenario → Regenerate bill → Deduct commission<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Billing dispute resolution<\/td>\n<td>Resolve immediately — no delays for Elite customers<\/td>\n<td>Prioritize resolution in same call<\/td>\n<td>Standard<\/td>\n<td>Standard timelines<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Customer unreachable<\/td>\n<td>OB x3 + TL flag + compensate captain immediately<\/td>\n<td>OB attempt x3 before closing<\/td>\n<td>Note on account<\/td>\n<td>Wait per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "5", "title": "Start-End Issues (Inbound Calls)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling 'start-end' trips (trips started and ended very quickly), ensuring investigation of potential fraud and correct commission adjustments.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Identify Caller<\/strong><\/p>\n<p>Determine if the call is from the Captain or the Customer.<\/p>\n<p><strong>Step 2: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm the Captain's name.<\/p>\n<p><strong>Identify Reason:<\/strong> Ask why the trip ended early.<\/p>\n<p><strong>Instructions:<\/strong> Tell the Captain to wait and accept a new trip request from the customer.<\/p>\n<p><strong>Assign Ticket:<\/strong> Assign the ticket to yourself to monitor if the customer books again.<\/p>\n<\/blockquote>\n<p>Based on customer activity:<\/p>\n<blockquote>\n<p>• Customer books new trip → Reverse admin commission on the first trip<\/p>\n<p>• Customer does not book → Treat as off-app trip, follow up with both parties<\/p>\n<\/blockquote>\n<p><strong>Step 3: Customer Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm Customer's name.<\/p>\n<p><strong>Gather Details:<\/strong> Ask for the reason the trip ended and the amount paid.<\/p>\n<p><strong>Investigate:<\/strong> Check the drop-off location vs. the next trip's start point, considering the time gap.<\/p>\n<\/blockquote>\n<p>Determine fraud and act:<\/p>\n<blockquote>\n<p>• Fraud suspected → Escalate ticket immediately under start-end fraud category<\/p>\n<p>• No fraud → OB Captain for their account, then escalate ticket for investigation<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Early trip end — fraud suspected<\/td>\n<td>TL handles directly — no auto-escalation without TL review<\/td>\n<td>TL notification before escalation<\/td>\n<td>Escalate per policy<\/td>\n<td>Escalate per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Commission reversal<\/td>\n<td>Apply + proactive OB to customer to confirm satisfaction<\/td>\n<td>Apply + courtesy note to customer<\/td>\n<td>Apply if customer re-books<\/td>\n<td>Apply if customer re-books<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "6", "title": "Cancellation of Active Trip Before Arrival (Customer)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling inbound calls from Customers requesting to cancel an active trip prior to the Captain's arrival, specifically when the Captain is moving away or is unreachable.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Scenario A: Captain Moving Away from Pickup Location<\/strong><\/p>\n<blockquote>\n<p>• Confirm Customer's name.<\/p>\n<p>• Confirm the reason for cancellation.<\/p>\n<p>• Check the live map to verify the Captain is moving away.<\/p>\n<p>• Cancel the trip and apply the cancellation fee to the Captain.<\/p>\n<\/blockquote>\n<p><strong>Scenario B: Captain's Phone Offline or Unreachable<\/strong><\/p>\n<blockquote>\n<p>• Confirm Customer's name.<\/p>\n<p>• Confirm the reason for cancellation.<\/p>\n<p>• Hold the Customer and initiate an OB call to the Captain.<\/p>\n<p>• Verify the phone status: Disconnected / Off / Unreachable / Not answering (2 attempts).<\/p>\n<p>• Cancel the trip and apply the cancellation fee to the Captain.<\/p>\n<\/blockquote>\n<p><strong>4. Quick Reference Flowchart<\/strong><\/p>\n<blockquote>\n<p>• Captain moving away → Confirm → Check map → Cancel (fee on Captain)<\/p>\n<p>• Captain unreachable → Confirm → Hold → OB x2 → Cancel (fee on Captain)<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cancellation fee (customer error)<\/td>\n<td>Always waive + apology + wallet credit<\/td>\n<td>Always waive<\/td>\n<td>Waive first time per month<\/td>\n<td>Apply per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Captain unresponsive<\/td>\n<td>OB x2 + immediate TL alert + compensate VIP<\/td>\n<td>OB x2 + flag captain + note<\/td>\n<td>OB x2 then cancel<\/td>\n<td>OB x2 then cancel<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Customer waiting too long<\/td>\n<td>Full compensation + personal apology from TL<\/td>\n<td>Apologize + compensation<\/td>\n<td>Apologize + update<\/td>\n<td>Inform of status<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "7", "title": "Cancellation of Active Trip After Arrival", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling cancellations after the Captain has arrived, with fair fee application per company policy.<\/p>\n<p><strong>Part A: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm Captain's name.<\/p>\n<p><strong>Determine Reason:<\/strong> Ask for the reason for cancellation.<\/p>\n<\/blockquote>\n<p>Apply cancellation fee matrix:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Captain's Reason<\/strong><\/td>\n<td><strong>Acceptable?<\/strong><\/td>\n<td><strong>Fee<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Flat tire / puncture<\/strong><\/td>\n<td>No<\/td>\n<td>Fee applies<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Refused destination or payment method<\/strong><\/td>\n<td>No<\/td>\n<td>Fee applies<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Arrived at wrong location<\/strong><\/td>\n<td>No<\/td>\n<td>Fee applies<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Minor passenger / excessive luggage<\/strong><\/td>\n<td>Yes<\/td>\n<td>No fee<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Customer bad behavior<\/strong><\/td>\n<td>Yes<\/td>\n<td>No fee<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Road closed / blocked<\/strong><\/td>\n<td>Yes<\/td>\n<td>No fee<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Part B: Customer Calls<\/strong><\/p>\n<p>Hold customer → OB call Captain → Apply customer-side matrix.<\/p>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cancellation fee (Captain's fault)<\/td>\n<td>Waive + wallet credit to customer<\/td>\n<td>Waive — fee on captain<\/td>\n<td>Waive — fee on captain<\/td>\n<td>Waive — fee on captain<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cancellation fee (Customer's fault)<\/td>\n<td>Always waive + goodwill gesture<\/td>\n<td>Always waive<\/td>\n<td>Waive on first dispute<\/td>\n<td>Apply per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Disputed cancellations<\/td>\n<td>Resolve in customer's favor — escalate if needed<\/td>\n<td>Lean toward customer<\/td>\n<td>Investigate + give benefit of doubt<\/td>\n<td>Investigate normally<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "8", "title": "Distance Minus Issues (Captain Calls)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle cases where the recorded distance is less than the actual route taken, ensuring fair fare adjustments and fraud prevention.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Initial Verification<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm Captain's name.<\/p>\n<p><strong>Analyze Route Data:<\/strong> Compare recorded distance and time in the system against the Captain's GPS route.<\/p>\n<\/blockquote>\n<p><strong>Step 2: Identify Scenario<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario A – Customer Present:<\/strong> Recalculate trip using actual route. Give customer option to pay the old or new bill. If customer refuses higher price with no prior note: add warning note. If prior note exists: escalate for block.<\/p>\n<p><strong>Scenario B – Customer Absent:<\/strong> Put Captain on hold → OB Customer → Based on response: adjust bill and compensate captain, or add penalty note on captain's file if customer paid more than captain claimed.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Fare recalculation dispute<\/td>\n<td>Adjust fare immediately, no interrogation<\/td>\n<td>Accept customer's account — adjust fare<\/td>\n<td>Give benefit of doubt<\/td>\n<td>Investigate per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Note on VIP profile<\/td>\n<td>Never add note — escalate to TL instead<\/td>\n<td>Do not add note without TL approval<\/td>\n<td>Add warning note only<\/td>\n<td>Add if justified<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "9", "title": "Distance Plus Issues", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle cases where the recorded distance exceeds the standard route, ensuring accurate and fair fare adjustments.<\/p>\n<p><strong>Part A: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm Captain's name.<\/p>\n<\/blockquote>\n<p>Compare trip distance and time against the standard system route. If customer is inside: recalculate using 'Adjust Bill' feature.<\/p>\n<p><strong>Part B: Customer Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm Customer's name.<\/p>\n<\/blockquote>\n<p>Compare distance against standard route. Determine customer location:<\/p>\n<blockquote>\n<p><strong>Customer present:<\/strong> Adjust bill → Hold customer → Inform captain of updated amount → Inform customer of correct amount.<\/p>\n<p><strong>Customer absent:<\/strong> Manually recalculate → OB Captain: if 'fair price' paid: adjust captain commission, no customer compensation. If 'full bill price' paid: compensate customer.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Overcharge due to Distance+<\/td>\n<td>Full compensation, no cap, no questions<\/td>\n<td>Up to 8 JD compensation<\/td>\n<td>Up to 5 JD compensation<\/td>\n<td>Investigate + max 3 JD<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Benefit of doubt<\/td>\n<td>Always resolve in customer's favor<\/td>\n<td>Accept customer version<\/td>\n<td>Lean toward customer<\/td>\n<td>Both sides investigated<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "10", "title": "Long Path Issues", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle cases where the actual route differs significantly from the optimal Google route, ensuring fair investigation and compensation.<\/p>\n<p><strong>Part A: Customer Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Customer chose the longer route:<\/strong> Customer must pay full bill. First complaint: courtesy compensation + note. Repeat: no compensation if prior note exists.<\/p>\n<p><strong>Scenario 2 – Captain admits longer route (no prior notes):<\/strong> Compensate customer and deduct from captain.<\/p>\n<p><strong>Scenario 3 – Captain denies (first offense, no notes):<\/strong> Compensate customer max 1 JD + warning note on captain.<\/p>\n<p><strong>Scenario 4 – Captain denies (repeat offender, has notes):<\/strong> Compensate customer + escalate ticket immediately.<\/p>\n<\/blockquote>\n<p><strong>Part B: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Route change with customer consent:<\/strong> Captain must collect updated full bill.<\/p>\n<p><strong>Scenario 2 – Deviation due to road/map issues:<\/strong> If customer didn't pay: compensate captain, ask customer to pay fair price. If customer paid full: compensate customer for the difference.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Long path complaint<\/td>\n<td>Full refund of extra amount immediately<\/td>\n<td>Compensate up to 8 JD — no interrogation<\/td>\n<td>Compensate up to 5 JD<\/td>\n<td>Investigate per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Captain note for repeat offense<\/td>\n<td>Do not add — TL reviews separately<\/td>\n<td>TL decision required<\/td>\n<td>Add with TL awareness<\/td>\n<td>Add if proven<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "11", "title": "Short Path Trips (Early Termination)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle calls regarding short trips that ended early, applying correct billing per company policy.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p>Confirm caller identity → Investigate reason → Apply policy matrix:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Reason for Early End<\/strong><\/td>\n<td><strong>Acceptable?<\/strong><\/td>\n<td><strong>Bill Customer?<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Customer smoking<\/strong><\/td>\n<td>Yes<\/td>\n<td>Yes — charge customer<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Customer drunk<\/strong><\/td>\n<td>Yes<\/td>\n<td>Yes — charge customer<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Too many passengers<\/strong><\/td>\n<td>Yes<\/td>\n<td>Yes — charge customer<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Captain's vehicle accident<\/strong><\/td>\n<td>No<\/td>\n<td>No charge<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Captain smoking<\/strong><\/td>\n<td>No<\/td>\n<td>No charge<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Captain refused destination or payment<\/strong><\/td>\n<td>No<\/td>\n<td>No charge<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Captain misconduct<\/strong><\/td>\n<td>No<\/td>\n<td>No charge<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Charge disputed by customer<\/td>\n<td>Waive charge + full apology + wallet credit<\/td>\n<td>Apply + apologize + courtesy credit<\/td>\n<td>Apply + apologize<\/td>\n<td>Apply per matrix<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Trip ended due to captain<\/td>\n<td>No charge + compensate customer + TL escalation<\/td>\n<td>No charge + note on captain + QA flag<\/td>\n<td>No charge + note on captain<\/td>\n<td>No charge per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "12", "title": "Extra Amount Complaints (Overcharging)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a standardized process for handling customers reporting that a Captain collected an extra amount above the official system fare.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Initial Investigation<\/strong><\/p>\n<blockquote>\n<p><strong>Confirm Identity:<\/strong> Confirm Customer's name.<\/p>\n<p><strong>Gather Details:<\/strong> Confirm the exact extra amount and the reason the Captain gave.<\/p>\n<p><strong>Hold:<\/strong> Place the Customer on a brief hold.<\/p>\n<p><strong>Contact Captain:<\/strong> Initiate an OB call to investigate.<\/p>\n<\/blockquote>\n<p><strong>Step 2: Resolution Matrix<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario A – Captain Admits:<\/strong> Inform captain of wallet deduction → Confirm compensation to customer → Escalate ticket.<\/p>\n<p><strong>Scenario B – Captain Denies (no notes on either):<\/strong> Escalate ticket → Check customer profile → If no notes: compensate max 3 JD + add detailed note.<\/p>\n<p><strong>Scenario C – Captain Denies (captain has notes):<\/strong> Compensate customer from company side → Escalate immediately for disciplinary action.<\/p>\n<p><strong>Scenario D – Captain Denies (customer has notes):<\/strong> Escalate ticket → Check customer history → Inform politely: no action or compensation at this time.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Compensation amount<\/td>\n<td>Full amount — no cap — resolve immediately<\/td>\n<td>Up to 8 JD<\/td>\n<td>Up to 5 JD<\/td>\n<td>Max 3 JD<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Captain note required<\/td>\n<td>Never add note without TL — customer is priority<\/td>\n<td>TL approval before adding<\/td>\n<td>Add per policy<\/td>\n<td>Add per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Captain denies (no notes)<\/td>\n<td>Full refund + apologize + captain escalation<\/td>\n<td>Max 8 JD + note<\/td>\n<td>Max 5 JD + note<\/td>\n<td>Max 3 JD + note<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Customer has prior notes<\/td>\n<td>Compensate with TL awareness<\/td>\n<td>Review carefully — lean customer<\/td>\n<td>Review + small courtesy<\/td>\n<td>No compensation<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "13", "title": "Unpaid Amount Claims", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish a structured procedure for handling trip fare unpaid amount claims, ensuring fair compensation for captains and proper customer account documentation.<\/p>\n<p><strong>Part A: Captain Calls<\/strong><\/p>\n<p>Initial steps: Confirm identity → Investigate reason → OB call customer.<\/p>\n<p><strong>Section 1: Unpaid Amount &lt; 3 JD<\/strong><\/p>\n<blockquote>\n<p>• Customer answers &amp; claims paid → Add note + compensate captain (if licensed and fare &lt; 10 JD)<\/p>\n<p>• Customer no answer x2 (no prior notes) → Add note + compensate captain<\/p>\n<p>• Customer no answer x2 (has prior notes) → Add note + compensate captain + escalate for account block<\/p>\n<\/blockquote>\n<p><strong>Section 2: Unpaid Amount &gt; 3 JD<\/strong><\/p>\n<blockquote>\n<p>• Customer answers &amp; claims paid → Add note + compensate captain<\/p>\n<p>• Customer answers &amp; admits non-payment → Add note + coordinate payment settlement<\/p>\n<p>• Customer no answer x2 → Add note + compensate captain + escalate for block if new user or 2 prior notes<\/p>\n<\/blockquote>\n<p><strong>Part B: Customer Calls to Pay<\/strong><\/p>\n<blockquote>\n<p><strong>Customer calling to settle:<\/strong> Confirm identity → Investigate → OB captain. If answers: coordinate payment. If no answer x2: advise customer to top up wallet in the app.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Customer doesn't pay<\/td>\n<td>Compensate captain immediately + TL reviews VIP account<\/td>\n<td>OB x3 + note + compensate + TL awareness<\/td>\n<td>OB + note + compensate captain<\/td>\n<td>OB + note + compensate captain<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Account block decision<\/td>\n<td>Never block without TL sign-off<\/td>\n<td>Requires TL approval<\/td>\n<td>Requires TL approval<\/td>\n<td>Per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "14", "title": "Promo Code Issues and Inquiries", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle support calls regarding promo code discrepancies, technical failures, and general inquiries from customers and captains.<\/p>\n<p><strong>Part A: Customer Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Technical failure of promo code:<\/strong> Check system records. If customer paid full amount: process compensation. If customer refused full payment: compensate captain from our side.<\/p>\n<p><strong>Scenario 2 – Captain charged extra despite promo:<\/strong> Hold customer, OB captain. If captain denies with no notes: compensate customer + note on both profiles.<\/p>\n<p><strong>Scenario 3 – General promo inquiry:<\/strong> Check active campaigns. If code available: provide it. Always direct customer to official social media for updates.<\/p>\n<\/blockquote>\n<p><strong>Part B: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Promo payment inquiry:<\/strong> Check captain's wallet transaction history. If normal: clarify that promo amounts are added automatically upon trip completion.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Promo code failure<\/td>\n<td>Full compensation + extra courtesy gesture + TL note<\/td>\n<td>Immediate compensation + bonus gesture<\/td>\n<td>Immediate compensation<\/td>\n<td>Process compensation<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Proactive promo offers<\/td>\n<td>Always check for active promos — offer proactively<\/td>\n<td>Offer active promo if relevant<\/td>\n<td>Not applicable<\/td>\n<td>Not applicable<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "15", "title": "Visa Payment Issues", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle support calls regarding Visa transaction failures, double-charge disputes, and pending payment cases.<\/p>\n<p><strong>Part A: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Visa transaction failed (auto-converted to cash):<\/strong> OB customer to mediate cash settlement. If resolved: close ticket. If unresolved: add note, leave ticket pending.<\/p>\n<p><strong>Scenario 2 – Visa transaction with no status:<\/strong> Inform captain not to collect any cash. Assign ticket to yourself for follow-up.<\/p>\n<\/blockquote>\n<p><strong>Part B: Customer Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Double charge (Visa + cash, &lt; 3 JD):<\/strong> Verify captain admission or denial. If admits: compensate. If denies (no notes): compensate + note on both profiles + escalate.<\/p>\n<p><strong>Scenario 2 – Visa failed in app but customer sees bank deduction:<\/strong> Advise customer to pay captain cash + send screenshot of bank message via WhatsApp to support + escalate to Finance team.<\/p>\n<p><strong>Scenario 3 – Dispute on pending charge from old trip:<\/strong> OB old captain. If confirms: deduct from wallet + compensate new captain. If no answer x2 or denies: advise customer to pay + escalate.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Visa dispute resolution<\/td>\n<td>Immediate resolution + apology + courtesy credit<\/td>\n<td>Resolve in same call — no follow-up delays<\/td>\n<td>Prioritize + resolve in call<\/td>\n<td>Investigate per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Double charge compensation<\/td>\n<td>Full refund immediately — no investigation delay<\/td>\n<td>Up to 8 JD<\/td>\n<td>Up to 5 JD<\/td>\n<td>Investigate + max 3 JD<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Finance team escalation<\/td>\n<td>Immediate escalation with TL notification<\/td>\n<td>Urgent flag<\/td>\n<td>Priority flag<\/td>\n<td>Standard timeline<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "16", "title": "Cancellation Fee Inquiries &amp; Disputes", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle calls regarding cancellation fees: when they apply, and how to resolve disputes fairly.<\/p>\n<p><strong>Part A: Active / Recent Cancellations<\/strong><\/p>\n<p><strong>Section 1: Captain Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Within free cancellation window:<\/strong> Advise of policy, close call. No fee.<\/p>\n<p><strong>After free window ends:<\/strong> Inform captain fee applies and will be charged to customer on next trip.<\/p>\n<\/blockquote>\n<p><strong>Section 2: Customer Calls<\/strong><\/p>\n<blockquote>\n<p><strong>Captain's fault:<\/strong> Delete cancellation fee from customer's account immediately.<\/p>\n<p><strong>Customer's fault:<\/strong> Check loyalty and record. If good account: delete fee once as courtesy with a warning.<\/p>\n<\/blockquote>\n<p><strong>Part B: Historical Cancellation Fees on Completed Trips<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Customer paid + disputes (old captain's fault, denies):<\/strong> Compensate customer + note on both profiles.<\/p>\n<p><strong>Scenario 2 – Customer paid + disputes (old captain's fault, admits):<\/strong> Compensate customer + deduct from old captain's wallet + note.<\/p>\n<p><strong>Scenario 3 – Customer didn't pay + disputes (old captain's fault, denies):<\/strong> Advise no payment needed + reverse fee + warning note on old captain.<\/p>\n<\/blockquote>\n<p><strong>Section 4: Current Captain (Customer Refused to Pay)<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Old trip not old captain's fault:<\/strong> Pay current captain → deduct from customer + note.<\/p>\n<p><strong>Scenario 2 – Old trip was old captain's fault (denies):<\/strong> Pay current captain + note on old captain.<\/p>\n<p><strong>Scenario 3 – Old trip was old captain's fault (admits):<\/strong> Pay current captain + deduct from old captain's wallet.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cancellation fee — any scenario<\/td>\n<td>Always waive + goodwill gesture (wallet credit)<\/td>\n<td>Always waive<\/td>\n<td>Waive first dispute per month<\/td>\n<td>Apply per policy<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Repeated cancellation disputes<\/td>\n<td>TL handles directly — do not apply fee without TL<\/td>\n<td>TL decision<\/td>\n<td>Review carefully<\/td>\n<td>Apply + note<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "17", "title": "Missing Items (Lost &amp; Found)", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle inquiries about items left in vehicles, maintaining customer privacy and defining responsibility limits.<\/p>\n<p><strong>Core Rules<\/strong><\/p>\n<blockquote>\n<p>• Privacy: Never share either party's phone number without explicit permission.<\/p>\n<p>• Customer Responsibility: Lost items are the customer's legal and financial responsibility.<\/p>\n<\/blockquote>\n<p><strong>Part A: Captain Calls (Found an Item)<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Standard (Customer reachable):<\/strong> Request captain's permission to share their number → Hold → OB customer → Verify description → Coordinate return.<\/p>\n<p><strong>Scenario 2 – Customer unreachable:<\/strong> Advise captain to deliver item to company office or nearest police station.<\/p>\n<p><strong>Scenario 3 – Captain requests customer number:<\/strong> OB customer for permission. If no answer: apologize to captain, leave ticket pending.<\/p>\n<p><strong>Scenario 4 – Customer refuses to pay delivery cost:<\/strong> Inform captain they are not obligated to deliver at their own expense. Can bring to office or police.<\/p>\n<\/blockquote>\n<p><strong>Part B: Customer Calls (Lost an Item)<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Standard (Captain reachable):<\/strong> Request customer's permission to share their number → Hold → OB captain → Verify item → Coordinate return.<\/p>\n<p><strong>Scenario 2 – Captain unreachable:<\/strong> Return to customer, advise them → Escalate ticket immediately to tracking team.<\/p>\n<p><strong>Scenario 3 – Customer requests captain number:<\/strong> OB captain for permission. If no answer: apologize, leave ticket pending.<\/p>\n<p><strong>Scenario 4 – Captain demands money for delivery:<\/strong> No action against captain. Advise customer they are responsible for retrieval.<\/p>\n<p><strong>Scenario 5 – Captain not responding to customer:<\/strong> OB captain from support line. If no answer x2: escalate for account block.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Lost item urgency<\/td>\n<td>Immediate TL escalation + personal follow-up call<\/td>\n<td>Same-day resolution attempt<\/td>\n<td>Prioritize tracking<\/td>\n<td>Standard tracking<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Compensation for lost item stress<\/td>\n<td>Wallet credit + personal apology + priority tracking<\/td>\n<td>Courtesy wallet credit<\/td>\n<td>Small courtesy gesture<\/td>\n<td>Not standard<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "18", "title": "Account Security &amp; Privacy Inquiries", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To establish strict protocols for OTP requests and third-party information requests, ensuring maximum privacy and security.<\/p>\n<p><strong>Part A: OTP Requests<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Phone numbers do not match:<\/strong> Refuse OTP request. No action regardless of explanation.<\/p>\n<p><strong>Scenario 2 – Phone numbers match:<\/strong> Provide OTP or direct to login recovery process.<\/p>\n<\/blockquote>\n<p><strong>Part B: Third-Party Inquiries<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario 1 – Request for specific profile details:<\/strong> Refuse immediately citing privacy policy.<\/p>\n<p><strong>Scenario 2 – Filing a complaint on behalf of someone else:<\/strong> Ask security questions to verify connection to the trip, then document the complaint per standard protocol.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>OTP assistance<\/td>\n<td>Standard + TL notification if security concern<\/td>\n<td>Standard + priority handling<\/td>\n<td>Standard<\/td>\n<td>Standard verification only<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Account recovery<\/td>\n<td>Direct TL involvement + immediate resolution<\/td>\n<td>Priority guidance + follow-up<\/td>\n<td>Priority guidance<\/td>\n<td>Direct to standard process<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "19", "title": "Captain Calling from a Different Number", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle calls from captains using unregistered numbers, ensuring account security and correct routing.<\/p>\n<p><strong>3. Procedure<\/strong><\/p>\n<p><strong>Step 1: Check License Status &amp; Active Trip<\/strong><\/p>\n<blockquote>\n<p><strong>Scenario A – Captain requests callback (unlicensed):<\/strong> Check for active trip. If no trip: direct to Nashmi team. If active trip: callback on provided number.<\/p>\n<p><strong>Scenario B – Captain requests callback (licensed):<\/strong> Advise to call from registered number. Exception: if phone broken, proceed with callback on current number.<\/p>\n<p><strong>Scenario C – Captain requests action on active trip:<\/strong> Hold caller → OB to registered number. If registered number offline: execute requested action + escalate ticket for account block.<\/p>\n<\/blockquote>\n<p><strong>5. Profit Tier Handling<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>⚠ Before proceeding: (1) Check Profit Tier in system. (2) Check Trip Count — if 500+, treat as Good Profit regardless of tier. Both conditions together = maximum priority.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspect<\/strong><\/th>\n<th><strong>💚 Good Profit<\/strong><\/th>\n<th><strong>🟢 Moderate Profit<\/strong><\/th>\n<th><strong>🟠 Low Profit<\/strong><\/th>\n<th><strong>🔴 Very Low Profit<\/strong><\/th>\n<th><strong>⚫ Loss Profit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>VIP customer trip affected<\/td>\n<td>Immediate resolution + TL notification<\/td>\n<td>Priority handling — resolve in same call<\/td>\n<td>Standard handling<\/td>\n<td>Standard handling<\/td>\n<td>Standard treatment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"num": "20", "title": "Driver Fines and Inactivity Fees", "body": "<p><strong>1. Purpose<\/strong><\/p>\n<p>To handle calls from captains disputing cancellation fines or inactivity fees from suspended trips.<\/p>\n<p><strong>Part A: Driver Fines (Trip Cancellations)<\/strong><\/p>\n<p>Confirm identity → Check cancellation limits (support vs. captain). If within limit: reverse fee. If exceeded, apply policy matrix:<\/p>\n<blockquote>\n<p>• We didn't answer captain's call (verified by logs) → Acceptable → Reverse fee<\/p>\n<p>• Accident → Acceptable → Reverse fee<\/p>\n<p>• Technical issue → Acceptable → Reverse fee<\/p>\n<p>• Captain's own fault / personal refusal → Not acceptable → Keep fee<\/p>\n<p>• Off-app trip → Not acceptable → Keep fee<\/p
